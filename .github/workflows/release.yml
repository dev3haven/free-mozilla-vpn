# ============================================================================
# Free Mozilla VPN — Nuitka CI
# ----------------------------------------------------------------------------
# Builds mozvpn_beta.py into optimized onefile binaries:
#   Linux   : x86_64, aarch64 (native runners), i386 (official
#             i386/python:3.14-slim-bookworm Docker image, natively, no QEMU)
#   Windows : x64, arm64 (native runners), x86 (official 32-bit CPython
#             installer from python.org + MSVC cross-tools)
#
# Build rules:
#   - Python 3.14 from official sources only: actions/setup-python,
#     the official python Docker image (Docker Hub), the official
#     python.org installer.
#   - ALL Python dependencies are installed ONLY from binary wheels
#     (pip --only-binary=:all:). Nothing is ever built from an sdist.
#   - System packages are installed with the platform's native package
#     manager (apt).
#   - Nuitka optimizations: onefile+standalone, LTO, --jobs set to the
#     full core count, Nuitka/ccache caching between runs, dynamic
#     --include-package flags.
#
# Trigger: push a v* tag (a Release with the binaries is created) or run
# manually (Actions -> Run workflow).
# ============================================================================

name: Build binaries (Nuitka, Python 3.14)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "Free Mozilla VPN"
  APP_VERSION: "1.0.0.0"
  # Current stable CPython 3.14 line (3.14.0 was released 2025-10-07).
  PYTHON_VERSION: "3.14"
  # Exact patch version for the 32-bit python.org installer (an exact URL
  # is required). Before running, verify this is the latest 3.14 patch.
  PYTHON_PATCH_VERSION: "3.14.7"

jobs:
  # ==========================================================================
  # LINUX — x86_64 (ubuntu-24.04) and aarch64 (ubuntu-24.04-arm), natively
  # ==========================================================================
  build-linux:
    name: Linux ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: amd64
            os: ubuntu-24.04
            artifact: mozvpn-linux-amd64
          - id: arm64
            os: ubuntu-24.04-arm
            artifact: mozvpn-linux-arm64
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.14 (official CPython builds)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # System tools — ONLY from the official Ubuntu repositories
      # (prebuilt deb packages, never compiled from source).
      - name: Install system build tools (Ubuntu official repos)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache patchelf

      - name: Cache pip / Nuitka / ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ env.NUITKA_CACHE_DIR }}
            ${{ env.CCACHE_DIR }}
          key: nuitka-linux-${{ matrix.id }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('mozvpn_beta.py') }}
          restore-keys: |
            nuitka-linux-${{ matrix.id }}-py${{ env.PYTHON_VERSION }}-
            nuitka-linux-${{ matrix.id }}-

      - name: Install Nuitka (latest stable, binary wheels only)
        run: |
          python -m pip install --only-binary=:all: --upgrade pip setuptools wheel
          python -m pip install --only-binary=:all: --upgrade Nuitka ordered-set
          python -m nuitka --version

      # All application dependencies — prebuilt PyPI wheels only.
      # If no prebuilt wheel exists for the platform, the dependency is
      # skipped with a warning (no sdist building ever happens). The
      # script itself works fine without optional packages (all of its
      # imports are wrapped in try/except).
      - name: Install application dependencies (binary wheels only)
        run: |
          INCLUDE_FLAGS=""
          for pair in "pyotp:pyotp" "zxing-cpp:zxingcpp" "Pillow:PIL" "aioquic:aioquic"; do
            pkg="${pair%%:*}"
            mod="${pair##*:}"
            if python -m pip install --only-binary=:all: --upgrade "$pkg"; then
              INCLUDE_FLAGS="$INCLUDE_FLAGS --include-package=$mod"
              echo "OK: $pkg ($mod)"
            else
              echo "::warning::No prebuilt binary wheel for '$pkg' on ${{ matrix.id }} - skipped (the script degrades gracefully)."
            fi
          done
          echo "INCLUDE_FLAGS=$INCLUDE_FLAGS" >> "$GITHUB_ENV"
          python -m pip freeze

      - name: Compile with Nuitka (optimized onefile)
        run: |
          JOBS=$(nproc)
          echo "Compiling with $JOBS parallel jobs..."
          python -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --jobs="$JOBS" \
            --assume-yes-for-downloads \
            --output-dir=build \
            --output-filename=mozvpn \
            --remove-output \
            --report=build/compilation-report.xml \
            $INCLUDE_FLAGS \
            mozvpn_beta.py
          ls -la build/

      - name: Smoke test (binary must start)
        run: ./build/mozvpn --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/mozvpn
          if-no-files-found: error

      - name: Upload compilation report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-report
          path: build/compilation-report.xml
          if-no-files-found: ignore

  # ==========================================================================
  # LINUX i386 — the official i386/python Docker image (Docker Hub, the
  # Python project's own image). Runs on an amd64 runner NATIVELY (no
  # QEMU): 32-bit processes are executed directly by the CPU.
  # ==========================================================================
  build-linux-i386:
    name: Linux i386 (official python image)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: i386/python:3.14-slim-bookworm
    env:
      NUITKA_CACHE_DIR: /tmp/nuitka-cache
      CCACHE_DIR: /tmp/ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The container's native package manager — apt (Debian bookworm,
      # official repositories). git is required by actions/checkout
      # inside a container.
      - name: Install system build tools (Debian official repos)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ccache patchelf git ca-certificates

      - name: Verify 32-bit Python 3.14
        run: |
          python3 -c "import struct, sys; print(sys.version); assert struct.calcsize('P') * 8 == 32, 'not a 32-bit interpreter!'"

      - name: Install Nuitka (latest stable, binary wheels only)
        run: |
          python3 -m pip install --only-binary=:all: --upgrade pip setuptools wheel
          python3 -m pip install --only-binary=:all: --upgrade Nuitka ordered-set
          python3 -m nuitka --version

      # On i386 not every package ships a prebuilt wheel. Anything without
      # a wheel is skipped — honoring the "never build from sdist" rule.
      - name: Install application dependencies (binary wheels only)
        run: |
          INCLUDE_FLAGS=""
          for pair in "pyotp:pyotp" "zxing-cpp:zxingcpp" "Pillow:PIL" "aioquic:aioquic"; do
            pkg="${pair%%:*}"
            mod="${pair##*:}"
            if python3 -m pip install --only-binary=:all: --upgrade "$pkg"; then
              INCLUDE_FLAGS="$INCLUDE_FLAGS --include-package=$mod"
              echo "OK: $pkg ($mod)"
            else
              echo "::warning::No prebuilt binary wheel for '$pkg' on i386 - skipped (the script degrades gracefully)."
            fi
          done
          echo "INCLUDE_FLAGS=$INCLUDE_FLAGS" >> "$GITHUB_ENV"
          python3 -m pip freeze

      - name: Compile with Nuitka (optimized onefile)
        run: |
          JOBS=$(nproc)
          echo "Compiling with $JOBS parallel jobs..."
          python3 -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --jobs="$JOBS" \
            --assume-yes-for-downloads \
            --output-dir=build \
            --output-filename=mozvpn \
            --remove-output \
            --report=build/compilation-report.xml \
            $INCLUDE_FLAGS \
            mozvpn_beta.py
          ls -la build/

      - name: Smoke test (binary must start)
        run: ./build/mozvpn --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mozvpn-linux-i386
          path: build/mozvpn
          if-no-files-found: error

  # ==========================================================================
  # WINDOWS — x64 and arm64 natively; x86 via the official 32-bit python.org
  # installer + MSVC cross-tools. MinGW64 is unusable with Python >= 3.13,
  # so --msvc=latest is used everywhere (per the Nuitka documentation).
  # ==========================================================================
  build-windows:
    name: Windows ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: amd64
            os: windows-11
            arch: x64
            artifact: mozvpn-windows-amd64
          - id: arm64
            os: windows-11-arm
            arch: arm64
            artifact: mozvpn-windows-arm64
          - id: i386
            os: windows-11
            arch: x86
            artifact: mozvpn-windows-i386
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Native word sizes (x64, arm64) — official CPython builds.
      - name: Set up Python 3.14 (official CPython builds)
        if: matrix.arch != 'x86'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 32-bit build: the official python.org installer.
      # The file WITHOUT a suffix (python-3.14.7.exe) is the 32-bit
      # installer; the 64-bit one is called *-amd64.exe.
      - name: Install 32-bit Python 3.14 (official python.org installer)
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          $ver = $env:PYTHON_PATCH_VERSION
          $installer = "python-$ver.exe"
          curl.exe -L -o "$installer" "https://www.python.org/ftp/python/$ver/$installer"
          Start-Process -Wait -FilePath ".\$installer" -ArgumentList `
            "/quiet", "InstallAllUsers=1", "PrependPath=1", "Include_test=0"
          $pyDir = "C:\Program Files (x86)\Python3$($ver.Split('.')[1])"
          Add-Content $env:GITHUB_PATH $pyDir
          & "$pyDir\python.exe" -c "import struct, sys; print(sys.version); assert struct.calcsize('P')*8 == 32, 'not 32-bit!'"

      # MSVC from the runner image; ilammy/msvc-dev-cmd prepares the
      # compiler environment with the required target (x64 / x86 cross).
      # On the arm64 runner VS is already set up for the native target —
      # Nuitka will locate it on its own.
      - name: Set up MSVC environment (x64 / x86 targets)
        if: matrix.arch != 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Cache Nuitka cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-windows-${{ matrix.id }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('mozvpn_beta.py') }}
          restore-keys: |
            nuitka-windows-${{ matrix.id }}-py${{ env.PYTHON_VERSION }}-
            nuitka-windows-${{ matrix.id }}-

      - name: Install Nuitka (latest stable, binary wheels only)
        run: |
          python -m pip install --only-binary=:all: --upgrade pip setuptools wheel
          python -m pip install --only-binary=:all: --upgrade Nuitka ordered-set
          python -m nuitka --version

      - name: Install application dependencies (binary wheels only)
        run: |
          INCLUDE_FLAGS=""
          for pair in "pyotp:pyotp" "zxing-cpp:zxingcpp" "Pillow:PIL" "aioquic:aioquic"; do
            pkg="${pair%%:*}"
            mod="${pair##*:}"
            if python -m pip install --only-binary=:all: --upgrade "$pkg"; then
              INCLUDE_FLAGS="$INCLUDE_FLAGS --include-package=$mod"
              echo "OK: $pkg ($mod)"
            else
              echo "::warning::No prebuilt binary wheel for '$pkg' on windows-${{ matrix.arch }} - skipped (the script degrades gracefully)."
            fi
          done
          echo "INCLUDE_FLAGS=$INCLUDE_FLAGS" >> "$GITHUB_ENV"
          python -m pip freeze

      - name: Compile with Nuitka (optimized onefile)
        run: |
          JOBS=$NUMBER_OF_PROCESSORS
          echo "Compiling with $JOBS parallel jobs..."
          python -m nuitka \
            --standalone \
            --onefile \
            --msvc=latest \
            --lto=yes \
            --jobs="$JOBS" \
            --assume-yes-for-downloads \
            --output-dir=build \
            --output-filename=mozvpn.exe \
            --remove-output \
            --report=build/compilation-report.xml \
            --company-name="${{ env.APP_NAME }}" \
            --product-name="${{ env.APP_NAME }}" \
            --file-version="${{ env.APP_VERSION }}" \
            --product-version="${{ env.APP_VERSION }}" \
            --file-description="Mozilla VPN / Firefox IP Protection client" \
            $INCLUDE_FLAGS \
            mozvpn_beta.py
          ls -la build/

      - name: Smoke test (binary must start)
        run: ./build/mozvpn.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/mozvpn.exe
          if-no-files-found: error

      - name: Upload compilation report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-report
          path: build/compilation-report.xml
          if-no-files-found: ignore

  # ==========================================================================
  # RELEASE — only on a v* tag push. Gathers all binaries into a GitHub Release.
  # ==========================================================================
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-linux-i386, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: List binaries
        run: |
          find dist -maxdepth 1 -type f | sort
          file dist/* || true

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mozvpn-linux-amd64
            dist/mozvpn-linux-arm64
            dist/mozvpn-linux-i386
            dist/mozvpn-windows-amd64.exe
            dist/mozvpn-windows-arm64.exe
            dist/mozvpn-windows-i386.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
