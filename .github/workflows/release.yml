# ============================================================================
# Free Mozilla VPN — build mozvpn_beta.py with Nuitka (Python 3.14)
#
# Targets (unified uname-style naming, identical for every OS):
#   linux-x86_64   — 64-bit Intel/AMD Linux (a.k.a. x64 / amd64)
#   linux-x86      — 32-bit Linux (i386/i686)
#   linux-arm64    — 64-bit ARM Linux (= ARMv8-A, aarch64)
#   linux-armv7    — 32-bit ARM Linux (armhf / armv7)
#   windows-x86_64 — 64-bit Intel/AMD Windows (a.k.a. x64)
#   windows-x86    — 32-bit Windows (i386/i686)
#   windows-arm64  — 64-bit ARM Windows (= ARMv8; Windows 11 on Arm)
#
# ---------------------------------------------------------------------------
# DEPENDENCY MANAGEMENT (audited 2026-09-24):
#
#   ALL runtime dependencies (pyotp, zxing-cpp, Pillow, aioquic) live in
#   ONE file at the repo root: requirements.txt. Every build job runs
#   `pip install -r requirements.txt` when the file exists, and the
#   build FAILS if it cannot be satisfied — aioquic is REQUIRED (real
#   MASQUE / HTTP-3 CONNECT-UDP probing must be compiled in).
#
#   This is THE fix for the "dependencies NOT installed in the exe" bug:
#   mozvpn_beta.py imports these packages behind try/except ImportError,
#   and Nuitka compiles what is importable at BUILD time — with the
#   packages installed in the build env, the binary embeds them; the
#   startup dependency report then shows "installed" instead of
#   "NOT installed".
#
#   --include-package=pyotp / =zxingcpp / =PIL / =aioquic is passed at
#   compile time in every build job: the script's imports sit in
#   try/except blocks and some packages load submodules dynamically —
#   the explicit include forces Nuitka to follow every sub-module.
#
# RELEASE ATTACHMENTS: individual BINARY files, no zip. The release-bundle
# job downloads all build artifacts into one folder (merge-multiple:
# true) and attaches every mozvpn_beta-* file to the GitHub Release as a
# SEPARATE asset (softprops/action-gh-release supports multi-line file
# lists and glob patterns in `files`). Each asset keeps its OS-specific
# name: mozvpn_beta-windows-x86_64.exe, mozvpn_beta-linux-x86_64, etc.
# Per GitHub documentation, an asset filename must be unique within one
# release — the unified target naming guarantees that (one file per
# target). Nothing is zipped anywhere in this workflow anymore.
#
# FIX 1 (the historical windows-arm64 FATAL): since Python 3.12 the
#     CPython distributions from setup-python and the official python
#     Docker images NO LONGER BUNDLE setuptools (python/cpython#95299),
#     so Nuitka's --include-package=setuptools hard-fails with "failed
#     to locate package 'setuptools'" unless it is pip-installed first.
#     Fix: `pip install --upgrade pip setuptools wheel` runs in EVERY
#     build job before nuitka.
#
# FIX 5 (linux-x86 / linux-armv7 FATAL): on CPython 3.14 zstandard has
#     no prebuilt wheel for i386/armv7, so pip builds it from source
#     via cffi (the CFFI backend per the python-zstandard docs), and
#     cffi needs <ffi.h> from libffi-dev, which python:*-slim images
#     lack. The same cells may also have to BUILD aioquic from source
#     (no cp314 wheel) — cffi/libffi-dev covers that chain too. Fix:
#     libffi-dev is apt-installed in BOTH container jobs, with an ||
#     fallback for zstandard ONLY (aioquic stays REQUIRED — the build
#     fails if it cannot be built).
#
# FIX 6 (linux-armv7 slow/unstable build under QEMU): without `make`
#     gcc LTO falls back to SERIAL LTRANS linking (Nuitka#3238: "The
#     gcc compiler for LTO mode requires 'make' to be installed for
#     parallel linking"), which under QEMU turns the final link of
#     400+ objects into a multi-hour stall that can hit the
#     360-minute hosted-runner job limit. Fix: `make` and `ccache` are
#     apt-installed in BOTH container jobs, and the armv7 job gets an
#     explicit `timeout-minutes: 350` so an overrun fails fast and
#     clearly instead of being killed at the wall.
#
# FIX 8 (release assets): the release used to be one zip archive with
#      all binaries inside. Now every built binary is attached to the
#      GitHub Release as its own asset — no zip step exists at all.
#
# FIX 2: generate_release_notes = `true` (restored from a corrupted
#      paste artifact).
#
# FIX 3: the release job no longer uses `always()` — assets are
#      attached only when all `needs` jobs succeeded. build-linux-armv7
#      is continue-on-error: an emulated-build failure/timeout does NOT
#      block the release, but any real failure of a required job does.
#
# FIX 4: docker/setup-qemu-action v4 (current major line).
#
# Everything else verified and kept as-is:
#   * actions/checkout@v5, actions/setup-python@v6,
#     actions/upload-artifact@v7, actions/download-artifact@v8,
#     softprops/action-gh-release@v3 — current, valid major tags.
#   * setup-python provides pre-built CPython 3.14 for x64/x86 on
#     windows-latest and for arm64 on windows-11-arm.
#   * Tag filter "release/**" ("*" alone does NOT match "/" in tag
#     filters); a tag push uses the workflow file FROM THE COMMIT the
#     tag points at; the `release` event uses the DEFAULT branch's file
#     and cannot be filtered by tag (handled via the release job's `if`).
#   * `cache: pip` in setup-python is NOT used: it hard-fails when the
#     dependency glob matches nothing (actions/setup-python#807); the
#     container jobs do not go through setup-python either.
#   * jobs.<id>.container CANNOT be used for the 32-bit/emulated
#     builds: the runner mounts only 64-bit node binaries into /__e/,
#     so every action dies in an i386/armv7 container with
#     "exec /__e/node24/bin/node: no such file or directory"
#     (actions/runner#2115). Actions run on the host; the builds run
#     via plain `docker run` with the workspace bind-mounted.
#   * linux-x86 runs natively on the x86_64 kernel — no emulation;
#     linux-armv7 runs under QEMU user emulation — slow, experimental,
#     continue-on-error so a timeout can never break a release.
#   * Nuitka supports Python 3.4–3.14 and does NOT cross-compile; every
#     target is built natively (or emulated) with a PRE-BUILT CPython.
#   * For 32-bit Python on Windows, Nuitka requires MSVC (NOT MinGW);
#     MSVC is preinstalled on windows-latest; windows-11-arm ships
#     Visual Studio with ARM64 build tools.
#   * --include-package=pip / =setuptools stays: mozvpn_beta.py runs
#     pip AT RUNTIME (hotkey 'd' / --reinstall-deps), and Nuitka
#     standalone does not bundle pip/setuptools by default.
# ============================================================================

name: Build Free Mozilla VPN

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*", "release/**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  APP_NAME: "Free Mozilla VPN"
  SCRIPT: mozvpn_beta.py
  PYTHON_VERSION: "3.14"
  FILE_VERSION: "1.0.0.0"

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Main matrix: targets that run directly on hosted runners using a
  # pre-built CPython from setup-python.
  # --------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            python_arch: x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            python_arch: arm64
          - os: windows-latest
            target: windows-x86_64
            python_arch: x64
          - os: windows-11-arm
            target: windows-arm64
            python_arch: arm64
          - os: windows-latest
            target: windows-x86
            python_arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }} (${{ matrix.python_arch }})
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # -----------------------------------------------------------------
          # Runtime dependencies from requirements.txt (ALL REQUIRED,
          # including aioquic): the build FAILS if they cannot be
          # installed — a binary without them is broken (TOTP/QR do not
          # work, MASQUE probing falls back to HTTP CONNECT).
          # -----------------------------------------------------------------
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt not found — cannot build a working binary." >&2
            exit 1
          fi
          # FIX 1: Python 3.12+ CPython no longer bundles setuptools;
          # Nuitka --include-package=setuptools hard-fails without it.
          python -m pip install --upgrade pip setuptools wheel
          # Build tooling: Nuitka compiler + helpers for onefile compression.
          python -m pip install --upgrade nuitka ordered-set
          # zstandard: optional onefile compressor (uncompressed fallback).
          python -m pip install --upgrade zstandard || \
            echo "WARNING: zstandard install failed — the onefile payload will be uncompressed."

      - name: Install C compiler cache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang

      - name: Show toolchain info
        shell: bash
        run: |
          python --version
          python -c "import platform, sysconfig; print(platform.machine(), sysconfig.get_platform())"
          # Prove pip/setuptools AND ALL runtime deps are importable in
          # the build env (the precondition for the --include-package
          # options in the compile steps).
          python -c "import pip, setuptools, wheel; print('pip', pip.__version__, '| setuptools', setuptools.__version__)"
          python -c "import pyotp; print('pyotp', pyotp.__version__)"
          python -c "import zxingcpp; print('zxingcpp OK')"
          python -c "import PIL; print('Pillow', PIL.__version__)"
          python -c "import aioquic; print('aioquic OK')"
          python -m nuitka --version

      # ------------------------------------------------------------------------
      # Nuitka build. --include-package is passed for EVERY runtime dep:
      # the script's try/except imports plus dynamic submodule loading in
      # these packages would otherwise leave sub-modules out of the
      # standalone binary.
      # ------------------------------------------------------------------------
      - name: Compile with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --include-package=pip \
            --include-package=setuptools \
            --include-package=pyotp \
            --include-package=zxingcpp \
            --include-package=PIL \
            --include-package=aioquic \
            --clang \
            --jobs=4 \
            --output-dir=build \
            --output-filename="mozvpn_beta-${{ matrix.target }}" \
            --company-name="${{ env.APP_NAME }}" \
            --product-name="${{ env.APP_NAME }}" \
            --file-description="${{ env.APP_NAME }} (mozvpn_beta)" \
            --file-version="${{ env.FILE_VERSION }}" \
            --product-version="${{ env.FILE_VERSION }}" \
            --remove-output \
            --assume-yes-for-downloads \
            "${{ env.SCRIPT }}"

      - name: Compile with Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m nuitka `
            --standalone `
            --onefile `
            --lto=yes `
            --include-package=pip `
            --include-package=setuptools `
            --include-package=pyotp `
            --include-package=zxingcpp `
            --include-package=PIL `
            --include-package=aioquic `
            --jobs=4 `
            --output-dir=build `
            --output-filename="mozvpn_beta-${{ matrix.target }}.exe" `
            --company-name="${{ env.APP_NAME }}" `
            --product-name="${{ env.APP_NAME }}" `
            --file-description="${{ env.APP_NAME }} (mozvpn_beta)" `
            --file-version="${{ env.FILE_VERSION }}" `
            --product-version="${{ env.FILE_VERSION }}" `
            --copyright="${{ env.APP_NAME }}" `
            --windows-console-mode=force `
            --remove-output `
            --assume-yes-for-downloads `
            "${{ env.SCRIPT }}"

      - name: Smoke test binary (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          file "build/mozvpn_beta-${{ matrix.target }}"
          # --help works because the script uses argparse.
          "./build/mozvpn_beta-${{ matrix.target }}" --help || true

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "build/mozvpn_beta-${{ matrix.target }}.exe"
          if (Test-Path $bin) {
            # Non-fatal on purpose: an interactive console app may return
            # a non-zero exit code from --help; the build result is the
            # binary itself, which Test-Path already proved exists.
            & $bin --help
            Write-Host "smoke exit=$LASTEXITCODE"
          } else {
            throw "Binary not found: $bin"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mozvpn_beta-${{ matrix.target }}
          path: build/mozvpn_beta-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Linux x86 (32-bit): runs the build in an i386 container on the regular
  # x86_64 ubuntu-latest runner (the x86_64 kernel executes 32-bit code
  # natively, no emulation). jobs.<id>.container CANNOT be used (the runner
  # mounts only 64-bit node binaries into /__e/ — actions/runner#2115), so
  # all actions run on the host and the build runs via plain `docker run`
  # with the workspace bind-mounted (requirements.txt is visible inside
  # via the bind mount).
  # --------------------------------------------------------------------------
  build-linux-x86:
    name: Build linux-x86 (32-bit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile with Nuitka (32-bit Linux, inside i386 container)
        run: |
          set -euo pipefail
          # NOTE: the workflow-level env block is exported into run-step
          # shells, so ${PYTHON_VERSION} expands correctly here (host shell).
          docker run --rm \
            --platform linux/386 \
            -e PYTHON_VERSION \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            "python:${PYTHON_VERSION}-slim" \
            bash -euo pipefail -c '
              # Pre-built packages only — nothing compiled from sources.
              # libffi-dev provides <ffi.h> — required to build cffi,
              # which is required to build zstandard (and possibly
              # aioquic) from source on Python 3.14 (CFFI backend, no
              # prebuilt i386 cp314 wheels).
              # make: gcc LTO requires it for parallel LTRANS linking
              # (Nuitka#3238).
              apt-get update
              apt-get install -y --no-install-recommends \
                gcc g++ make ccache patchelf file libffi-dev
              python --version
              python -c "import platform; print(\"arch:\", platform.machine())"
              python -m pip install --upgrade pip
              # Runtime dependencies from requirements.txt (ALL REQUIRED,
              # including aioquic — built from source here if no i386
              # wheel exists; the build FAILS if that does not succeed).
              if [ -f requirements.txt ]; then
                python -m pip install -r requirements.txt
              else
                echo "ERROR: requirements.txt not found — cannot build a working binary." >&2
                exit 1
              fi
              # FIX 1: Python 3.12+ images do not bundle setuptools;
              # Nuitka --include-package=setuptools requires it.
              python -m pip install --upgrade pip setuptools wheel
              # Build tooling: Nuitka + onefile compression helpers.
              python -m pip install --upgrade nuitka ordered-set
              # zstandard: optional onefile compressor; libffi-dev makes
              # the source build succeed. If it still fails, continue
              # WITHOUT it: the payload is packed UNCOMPRESSED.
              python -m pip install --upgrade zstandard || \
                echo "WARNING: zstandard install failed — the onefile payload will be uncompressed."
              # Prove pip/setuptools + ALL runtime deps are importable.
              python -c "import pip, setuptools, wheel; print(\"pip+setuptools OK\")"
              python -c "import pyotp; print(\"pyotp\", pyotp.__version__)"
              python -c "import zxingcpp; print(\"zxingcpp OK\")"
              python -c "import PIL; print(\"Pillow\", PIL.__version__)"
              python -c "import aioquic; print(\"aioquic OK\")"
              python -m nuitka \
                --standalone \
                --onefile \
                --lto=yes \
                --include-package=pip \
                --include-package=setuptools \
                --include-package=pyotp \
                --include-package=zxingcpp \
                --include-package=PIL \
                --include-package=aioquic \
                --jobs=4 \
                --output-dir=build \
                --output-filename="mozvpn_beta-linux-x86" \
                --company-name="Free Mozilla VPN" \
                --product-name="Free Mozilla VPN" \
                --file-description="Free Mozilla VPN (mozvpn_beta)" \
                --file-version="1.0.0.0" \
                --product-version="1.0.0.0" \
                --remove-output \
                --assume-yes-for-downloads \
                "mozvpn_beta.py"
              # Smoke test: --help works because the script uses argparse.
              file build/mozvpn_beta-linux-x86
              ./build/mozvpn_beta-linux-x86 --help || true
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mozvpn_beta-linux-x86
          path: build/mozvpn_beta-linux-x86*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Linux armv7 (32-bit ARM, a.k.a. armhf): there is no armv7 hosted runner
  # and setup-python does not provide 32-bit ARM CPython, but nothing is
  # compiled from source. The official python Docker image is multi-arch
  # and publishes pre-built arm32v7 CPython builds, so this job pulls that
  # image with QEMU user-mode emulation on the x86_64 ubuntu-latest
  # runner (docker/setup-qemu-action registers the binfmt handlers).
  # QEMU emulation makes the Nuitka build slow — hence experimental
  # (continue-on-error) so a timeout cannot break the release.
  #
  # FIX 6 (armv7-specific):
  #   * `make` + `ccache` are apt-installed: without make, gcc LTO falls
  #     back to SERIAL LTRANS linking (Nuitka#3238) — hours under QEMU.
  #   * libffi-dev covers the cffi -> zstandard/aioquic source-build
  #     chain (no prebuilt armv7 cp314 wheels).
  #   * Explicit `timeout-minutes: 350`: the hosted-runner hard limit is
  #     360 minutes per job; an explicit, slightly lower value makes an
  #     emulated-build overrun fail fast with a clear message instead
  #     of being killed at the wall.
  # --------------------------------------------------------------------------
  build-linux-armv7:
    name: Build linux-armv7 (32-bit ARM, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    # QEMU-emulated builds are slow; fail with a clear timeout instead of
    # hanging until the 360-minute hosted-runner limit kills the job.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Registers QEMU static binaries with binfmt_misc so an armv7
      # container can run on the x86_64 runner (official Docker action).
      - name: Set up QEMU for armv7 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      # The build runs inside the arm32v7 container via plain `docker run`
      # (QEMU must be registered before the container starts, so a
      # jobs.container is not usable here). The workspace is bind-mounted
      # so the resulting binary is directly visible to the runner for
      # the artifact upload step (requirements.txt is visible inside
      # via the bind mount).
      - name: Compile with Nuitka (armv7 Linux, inside emulated container)
        run: |
          set -euo pipefail
          docker run --rm \
            --platform linux/arm/v7 \
            -e PYTHON_VERSION \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            "python:${PYTHON_VERSION}-slim" \
            bash -euo pipefail -c '
              # Pre-built packages only — nothing compiled from sources.
              # libffi-dev provides <ffi.h> — required to build cffi,
              # which is required to build zstandard (and possibly
              # aioquic) from source on Python 3.14 (CFFI backend, no
              # prebuilt armv7 cp314 wheels).
              # make + ccache are THE armv7 fix: without make, gcc LTO
              # links SERIALLY (Nuitka#3238) — hours under QEMU.
              apt-get update
              apt-get install -y --no-install-recommends \
                gcc g++ make ccache patchelf file libffi-dev
              python --version
              python -c "import platform; print(\"arch:\", platform.machine())"
              python -m pip install --upgrade pip
              # Runtime dependencies from requirements.txt (ALL REQUIRED,
              # including aioquic — built from source here; the build
              # FAILS if that does not succeed).
              if [ -f requirements.txt ]; then
                python -m pip install -r requirements.txt
              else
                echo "ERROR: requirements.txt not found — cannot build a working binary." >&2
                exit 1
              fi
              # Python 3.12+ images do not bundle setuptools any more;
              # Nuitka --include-package=setuptools requires it in the build env.
              python -m pip install --upgrade pip setuptools wheel
              # Build tooling: Nuitka compiler + onefile compression helpers.
              python -m pip install --upgrade nuitka ordered-set
              # zstandard: optional onefile compressor. On Python 3.14 it
              # builds from source via cffi (no wheel for this arch) —
              # libffi-dev (installed above) makes that succeed. If it still
              # fails (e.g. a QEMU build timeout), continue WITHOUT it:
              # the onefile payload is packed UNCOMPRESSED; the binary
              # stays fully functional.
              python -m pip install --upgrade zstandard || \
                echo "WARNING: zstandard install failed — the onefile payload will be uncompressed."
              # Prove pip/setuptools + ALL runtime deps are importable.
              python -c "import pip, setuptools, wheel; print(\"pip+setuptools OK\")"
              python -c "import pyotp; print(\"pyotp\", pyotp.__version__)"
              python -c "import zxingcpp; print(\"zxingcpp OK\")"
              python -c "import PIL; print(\"Pillow\", PIL.__version__)"
              python -c "import aioquic; print(\"aioquic OK\")"
              python -m nuitka \
                --standalone \
                --onefile \
                --lto=yes \
                --include-package=pip \
                --include-package=setuptools \
                --include-package=pyotp \
                --include-package=zxingcpp \
                --include-package=PIL \
                --include-package=aioquic \
                --jobs=4 \
                --output-dir=build \
                --output-filename="mozvpn_beta-linux-armv7" \
                --company-name="Free Mozilla VPN" \
                --product-name="Free Mozilla VPN" \
                --file-description="Free Mozilla VPN (mozvpn_beta)" \
                --file-version="1.0.0.0" \
                --product-version="1.0.0.0" \
                --remove-output \
                --assume-yes-for-downloads \
                "mozvpn_beta.py"
              # Smoke test: --help works because the script uses argparse.
              # The armv7 binary executes via the QEMU binfmt handlers
              # registered by docker/setup-qemu-action earlier.
              file build/mozvpn_beta-linux-armv7
              ./build/mozvpn_beta-linux-armv7 --help || true
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mozvpn_beta-linux-armv7
          path: build/mozvpn_beta-linux-armv7*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Release: downloads ALL build artifacts into one folder and attaches
  # every binary to the GitHub Release as a SEPARATE asset — NO zip (FIX 8).
  # Runs for v* tags, release/** tags, or a published GitHub Release.
  # Built only when all `needs` jobs succeeded (no `always()`);
  # build-linux-armv7 is continue-on-error, so its failure does NOT block
  # the release, but any real failure of a required job does.
  #
  # Per GitHub's release-assets documentation, asset names must be unique
  # within a release — the unified target naming (one file per OS/arch,
  # mozvpn_beta-<target>[.exe]) guarantees that. softprops/action-gh-release
  # attaches each matched file as its own asset and supports glob patterns
  # in `files`.
  # --------------------------------------------------------------------------
  release-bundle:
    name: Attach binaries to release
    needs: [build, build-linux-x86, build-linux-armv7]
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/release/') ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Download all build artifacts into the SAME folder (merge-multiple:
      # true) so every binary lands side by side as dist/mozvpn_beta-<target>.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify binaries
        run: |
          set -euo pipefail
          ls -laR dist
          if ! ls dist/mozvpn_beta-* >/dev/null 2>&1; then
            echo "ERROR: no binaries found in dist/ — nothing to attach to the release" >&2
            exit 1
          fi
          echo "Binaries to attach as individual release assets:"
          ls -1 dist/mozvpn_beta-*

      # Each file matching the glob becomes its OWN release asset:
      # mozvpn_beta-linux-x86_64, mozvpn_beta-linux-arm64,
      # mozvpn_beta-linux-x86, mozvpn_beta-linux-armv7,
      # mozvpn_beta-windows-x86_64.exe, mozvpn_beta-windows-x86.exe,
      # mozvpn_beta-windows-arm64.exe — no zip is created anywhere.
      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/mozvpn_beta-*
          generate_release_notes: true
