# ============================================================================
# Build Release (Nuitka) — multi-architecture CI/CD
#
# Архитектуры (все собираются НАТИВНО, без QEMU-эмуляции — Nuitka не умеет
# кросс-компиляцию, поэтому каждая цель собирается на совместимом окружении):
#   - Windows x64          -> windows-latest                          (native)
#   - Windows x86 (32-bit) -> windows-latest + setup-python x86       (native, WoW64)
#   - Linux   x64          -> ubuntu-latest                           (native)
#   - Linux   arm64        -> ubuntu-24.04-arm (бесплатный ARM-раннер) (native,
#                            baseline aarch64 = ARMv8-A; работает на ARMv8/ARMv9)
#   - Linux   armv9        -> ubuntu-24.04-arm + armv9-тюнинг GCC       (native,
#                            специализированная сборка: инструкции ARMv9-A,
#                            НЕ работает на armv8 — см. комментарий джобы)
#   - Linux   armv5        -> ubuntu-24.04-arm + docker linux/arm/v5    (native,
#                            самые старые ARM9/ARM10, экспериментально)
#   - Linux   armv7        -> ubuntu-24.04-arm + docker linux/arm/v7   (native AArch32
#                            на ARMv8-процессоре: 64-битные ARM-ядра исполняют
#                            32-битный ARMv7-код напрямую — старые Raspberry Pi,
#                            Android-устройства с armhf и т.п.)
#   - Linux   i386         -> ubuntu-latest + docker linux/386        (native на
#                            x86-64 CPU: старые 32-битные Linux-системы)
#   - Android x86_64       -> ubuntu-latest + termux/termux-docker:x86_64
#                            (Termux-окружение с bionic; Nuitka официально
#                            поддерживает Android через Termux)
#   - Android aarch64      -> ubuntu-24.04-arm + termux/termux-docker:aarch64
#
# ВАЖНО про зависимости: для «экзотических» целей (x86 win32, armv7, i386,
# Android) готовых wheel-пакетов zxing-cpp / Pillow может не быть. Установка
# сделана «best-effort»: pyotp (чистый Python) обязателен, остальные ставятся
# по возможности, а флаги --include-package добавляются ТОЛЬКО для реально
# импортируемых модулей — сборка не падает, бинарник просто собирается без
# необязательных QR/TOTP-модулей (как у варианта mozvpn_no_externals.py).
# ============================================================================

name: Build Release (Nuitka)

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write

# УСКОРЕНИЕ СБОРКИ БЕЗ ПОТЕРИ ОПТИМИЗАЦИИ (проверено по документации Nuitka):
#   ПРИОРИТЕТ — максимальная оптимизация бинарника, поэтому:
#   1) --lto=yes     — Link-Time Optimization («whole program optimization»)
#                      ВКЛЮЧЕНА явно: лучший код в бинарнике (медленнее
#                      собирается — сознательная цена; документация Nuitka).
#   2) anti-bloat    — --enable-plugin=anti-bloat + --noinclude-*-mode=nofollow
#                      отсекает бесполезные импорты (pytest/setuptools и т.п.):
#                      бинарник меньше, компиляция БЫСТРЕЕ, рантайм не страдает
#                      (официальная рекомендация Nuitka для ускорения сборки).
#   3) ccache + actions/cache — кэш объектных файлов МЕЖДУ запусками
#                      (при повторных тегах/хотфиксах пересобираются только
#                      изменённые файлы; на оптимизации это не сказывается:
#                      ccache кэширует результат компиляции, флаги те же).
#   4) ordered-set + zstandard — рекомендованы самим Nuitka для скорости
#                      компиляции (предупреждение "very slow fallback").
#   5) concurrency  — не даёт двум релизным сборкам одного тега работать
#                      параллельно впустую.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. Нативные сборки: Windows x64/x86 + Linux x64/arm64
  # ==========================================================================
  build:
    name: Build ${{ matrix.script }} (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm]
        script: [mozvpn.py, mozvpn_beta.py, mozvpn_no_externals.py]
        exclude:
          # Без externals-скрипт не тянет zxing-cpp/Pillow — при желании уберите исключение
          - os: ubuntu-latest
            script: mozvpn_no_externals.py
        include:
          # -------- Windows x64 --------
          - os: windows-latest
            label: windows-x64
            py_arch: x64
            nuitka_extra: "--windows-console-mode=force"
          # -------- Windows x86 (32-битные системы) --------
          - os: windows-latest
            label: windows-x86
            py_arch: x86
            nuitka_extra: "--windows-console-mode=force"
          # -------- Linux x64 --------
          - os: ubuntu-latest
            label: linux-x64
            py_arch: x64
            nuitka_extra: ""
          # -------- Linux arm64 (ARM-раннер GitHub, нативно) --------
          - os: ubuntu-24.04-arm
            label: linux-arm64
            py_arch: arm64
            nuitka_extra: ""

          # -------- Правила именования артефактов --------
          - os: windows-latest
            label: windows-x64
            script: mozvpn.py
            artifact_name: mozvpn-windows.exe
          - os: windows-latest
            label: windows-x64
            script: mozvpn_beta.py
            artifact_name: mozvpn-beta-windows.exe
          - os: windows-latest
            label: windows-x64
            script: mozvpn_no_externals.py
            artifact_name: mozvpn-no-externals-windows.exe
          - os: windows-latest
            label: windows-x86
            script: mozvpn.py
            artifact_name: mozvpn-windows-x86.exe
          - os: windows-latest
            label: windows-x86
            script: mozvpn_beta.py
            artifact_name: mozvpn-beta-windows-x86.exe
          - os: windows-latest
            label: windows-x86
            script: mozvpn_no_externals.py
            artifact_name: mozvpn-no-externals-windows-x86.exe
          - os: ubuntu-latest
            label: linux-x64
            script: mozvpn.py
            artifact_name: mozvpn-linux
          - os: ubuntu-latest
            label: linux-x64
            script: mozvpn_beta.py
            artifact_name: mozvpn-beta-linux
          - os: ubuntu-latest
            label: linux-x64
            script: mozvpn_no_externals.py
            artifact_name: mozvpn-no-externals-linux
          - os: ubuntu-24.04-arm
            label: linux-arm64
            script: mozvpn.py
            artifact_name: mozvpn-linux-arm64
          - os: ubuntu-24.04-arm
            label: linux-arm64
            script: mozvpn_beta.py
            artifact_name: mozvpn-beta-linux-arm64
          - os: ubuntu-24.04-arm
            label: linux-arm64
            script: mozvpn_no_externals.py
            artifact_name: mozvpn-no-externals-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Кэш ccache между запусками (только Linux: там ccache в PATH)
      - name: Cache ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.script }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.script }}-

      - name: Set up Python (${{ matrix.py_arch }})
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: ${{ matrix.py_arch }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache patchelf build-essential

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "Nuitka[app]" ordered-set zstandard
          # pyotp — чистый Python, обязателен везде.
          python -m pip install pyotp
          # zxing-cpp / Pillow / proxy.py — best-effort: для x86/arm целей
          # wheel-ов может не быть; сборка продолжится без них.
          python -m pip install zxing-cpp Pillow proxy.py \
            || echo "::warning::optional deps (zxing-cpp/Pillow/proxy.py) failed on this arch — building without them"

      - name: Build with Nuitka
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="${{ matrix.script }}"

          COMMON=(
            --onefile
            --output-dir=dist
            --remove-output
            --assume-yes-for-downloads
            --lto=yes
            --nofollow-import-to=tkinter
            --nofollow-import-to=unittest
            --nofollow-import-to=test
            # anti-bloat: отсекает ненужные импорты (pytest/setuptools и др.)
            # — МЕНЬШЕ бинарник И БЫСТРЕЕ компиляция, рантайм-оптимизации не тронуты
            --enable-plugin=anti-bloat
            --noinclude-pytest-mode=nofollow
            --noinclude-setuptools-mode=nofollow
          )

          # --include-package добавляем ТОЛЬКО для реально импортируемых
          # модулей (на целях без wheel-ов их просто нет в окружении).
          INCLUDES=( --include-package=pyotp )
          if python -c "import zxingcpp" 2>/dev/null; then
            INCLUDES+=( --include-package=zxingcpp )
          else
            echo "::notice::zxingcpp not importable — building without QR support"
          fi
          if python -c "import PIL" 2>/dev/null; then
            INCLUDES+=( --include-package=PIL )
          else
            echo "::notice::PIL not importable — building without image support"
          fi
          if python -c "import proxy" 2>/dev/null; then
            INCLUDES+=( --include-package=proxy )
          fi

          EXTRA="${{ matrix.nuitka_extra }}"

          python -m nuitka \
            "${COMMON[@]}" \
            "${INCLUDES[@]}" \
            ${EXTRA} \
            --output-filename="${{ matrix.artifact_name }}" \
            "$SCRIPT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # 2. Linux i386 (32-битный x86 Linux) — docker linux/386 на x64-раннере.
  #    i386-код исполняется x86-64 CPU нативно (эмуляция не нужна).
  # ==========================================================================
  build-linux-i386:
    name: Build ${{ matrix.script }} (linux-i386)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        script: [mozvpn.py, mozvpn_beta.py, mozvpn_no_externals.py]
        include:
          - script: mozvpn.py
            artifact_name: mozvpn-linux-i386
          - script: mozvpn_beta.py
            artifact_name: mozvpn-beta-linux-i386
          - script: mozvpn_no_externals.py
            artifact_name: mozvpn-no-externals-linux-i386

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Кэш ccache между запусками: каталог монтируется в контейнер
      # (CCACHE_DIR=/ccache), поэтому объектные файлы переживают перезапуски.
      - name: Cache ccache (container)
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.artifact_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.artifact_name }}-

      - name: Prepare container build script
        run: |
          cat > ci-build-in-docker.sh <<'EOS'
          set -euo pipefail
          SCRIPT="$1"
          ARTIFACT="$2"
          apt-get update
          apt-get install -y ccache patchelf build-essential
          python -m pip install --upgrade pip
          python -m pip install "Nuitka[app]" ordered-set zstandard
          python -m pip install pyotp
          python -m pip install zxing-cpp Pillow proxy.py \
            || echo "optional deps failed on i386 — building without them"
          INCLUDES=( --include-package=pyotp )
          python -c "import zxingcpp" 2>/dev/null && INCLUDES+=( --include-package=zxingcpp ) || true
          python -c "import PIL"       2>/dev/null && INCLUDES+=( --include-package=PIL )       || true
          python -c "import proxy"     2>/dev/null && INCLUDES+=( --include-package=proxy )     || true
          python -m nuitka \
            --onefile \
            --output-dir=dist \
            --remove-output \
            --assume-yes-for-downloads \
            --lto=yes \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=test \
            --enable-plugin=anti-bloat \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            "${INCLUDES[@]}" \
            --output-filename="$ARTIFACT" \
            "$SCRIPT"
          EOS
          chmod +x ci-build-in-docker.sh

      - name: Build in linux/386 container
        run: |
          docker run --rm \
            --platform linux/386 \
            -e CCACHE_DIR=/ccache -v "$PWD/.ccache":/ccache \
            -v "$PWD":/src -w /src \
            python:3.14-bookworm \
            bash ci-build-in-docker.sh "${{ matrix.script }}" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # 3. Linux armv7 (32-битный ARM: старые Raspberry Pi, armhf-дистрибутивы,
  #    старые Android с arm-Termux). Запускается на БЕСПЛАТНОМ arm64-раннере
  #    GitHub (ubuntu-24.04-arm): процессоры ARMv8 исполняют 32-битный
  #    ARMv7-код нативно — QEMU не нужен, сборка быстрая.
  # ==========================================================================
  build-linux-armv7:
    name: Build ${{ matrix.script }} (linux-armv7)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        script: [mozvpn.py, mozvpn_beta.py, mozvpn_no_externals.py]
        include:
          - script: mozvpn.py
            artifact_name: mozvpn-linux-armv7
          - script: mozvpn_beta.py
            artifact_name: mozvpn-beta-linux-armv7
          - script: mozvpn_no_externals.py
            artifact_name: mozvpn-no-externals-linux-armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Кэш ccache между запусками: каталог монтируется в контейнер
      # (CCACHE_DIR=/ccache), поэтому объектные файлы переживают перезапуски.
      - name: Cache ccache (container)
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.artifact_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.artifact_name }}-

      - name: Prepare container build script
        run: |
          cat > ci-build-in-docker.sh <<'EOS'
          set -euo pipefail
          SCRIPT="$1"
          ARTIFACT="$2"
          apt-get update
          apt-get install -y ccache patchelf build-essential
          python -m pip install --upgrade pip
          python -m pip install "Nuitka[app]" ordered-set zstandard
          python -m pip install pyotp
          python -m pip install zxing-cpp Pillow proxy.py \
            || echo "optional deps failed on armv7 — building without them"
          INCLUDES=( --include-package=pyotp )
          python -c "import zxingcpp" 2>/dev/null && INCLUDES+=( --include-package=zxingcpp ) || true
          python -c "import PIL"       2>/dev/null && INCLUDES+=( --include-package=PIL )       || true
          python -c "import proxy"     2>/dev/null && INCLUDES+=( --include-package=proxy )     || true
          python -m nuitka \
            --onefile \
            --output-dir=dist \
            --remove-output \
            --assume-yes-for-downloads \
            --lto=yes \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=test \
            --enable-plugin=anti-bloat \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            "${INCLUDES[@]}" \
            --output-filename="$ARTIFACT" \
            "$SCRIPT"
          EOS
          chmod +x ci-build-in-docker.sh

      - name: Build in linux/arm/v7 container
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            -e CCACHE_DIR=/ccache -v "$PWD/.ccache":/ccache \
            -v "$PWD":/src -w /src \
            python:3.14-bookworm \
            bash ci-build-in-docker.sh "${{ matrix.script }}" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # 3a. Linux armv5 (самые старые ARM: ARM9/ARM10, armv5te). ВАЖНО: теги
  #     python:*-bookworm НЕ публикуются для linux/arm/v5 (только amd64,
  #     arm32v7, arm64v8, i386, ppc64le — официальный манифест
  #     docker-library/official-images), поэтому используется тег
  #     python:3.12-TRIXIE (и новее — сейчас python:3.14-trixie) — эти теги
  #     публикуются с arm32v5. Официальный
  #     python-образ поддерживает arm32v5. armv5-код исполняется нативно на
  #     ARM64-раннере по цепочке обратной совместимости (armv5 -> armv6 ->
  #     armv7 -> armv8 AArch32). Цель МАКСИМАЛЬНО экспериментальная:
  #     wheels для armv5 почти не существует, GCC -march=armv5te валиден.
  #     Продолжаем best-effort: без необязательных QR-зависимостей.
  # ==========================================================================
  build-linux-armv5:
    name: Build ${{ matrix.script }} (linux-armv5)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        script: [mozvpn.py, mozvpn_beta.py, mozvpn_no_externals.py]
        include:
          - script: mozvpn.py
            artifact_name: mozvpn-linux-armv5
          - script: mozvpn_beta.py
            artifact_name: mozvpn-beta-linux-armv5
          - script: mozvpn_no_externals.py
            artifact_name: mozvpn-no-externals-linux-armv5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Кэш ccache между запусками: каталог монтируется в контейнер
      # (CCACHE_DIR=/ccache), поэтому объектные файлы переживают перезапуски.
      - name: Cache ccache (container)
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.artifact_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.artifact_name }}-

      - name: Prepare container build script
        run: |
          cat > ci-build-in-docker.sh <<'EOS'
          set -euo pipefail
          SCRIPT="$1"
          ARTIFACT="$2"
          apt-get update
          apt-get install -y ccache patchelf build-essential
          python -m pip install --upgrade pip
          python -m pip install "Nuitka[app]" ordered-set zstandard
          python -m pip install pyotp
          python -m pip install zxing-cpp Pillow proxy.py \
            || echo "optional deps failed on armv5 — building without them"
          INCLUDES=( --include-package=pyotp )
          python -c "import zxingcpp" 2>/dev/null && INCLUDES+=( --include-package=zxingcpp ) || true
          python -c "import PIL"       2>/dev/null && INCLUDES+=( --include-package=PIL )       || true
          python -c "import proxy"     2>/dev/null && INCLUDES+=( --include-package=proxy )     || true
          python -m nuitka \
            --onefile \
            --output-dir=dist \
            --remove-output \
            --assume-yes-for-downloads \
            --lto=yes \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=test \
            --enable-plugin=anti-bloat \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            "${INCLUDES[@]}" \
            --output-filename="$ARTIFACT" \
            "$SCRIPT"
          EOS
          chmod +x ci-build-in-docker.sh

      - name: Build in linux/arm/v5 container
        run: |
          docker run --rm \
            --platform linux/arm/v5 \
            -e CCACHE_DIR=/ccache -v "$PWD/.ccache":/ccache \
            -v "$PWD":/src -w /src \
            python:3.14-trixie \
            bash ci-build-in-docker.sh "${{ matrix.script }}" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # 3b. Linux armv6 (ARM11: Raspberry Pi 1/Zero/Zero W, старые роутеры).
  #     ВАЖНО (проверено по манифесту docker-library/official-images): в
  #     Debian-тегах python-образов arm32v6 НЕ существует ВООБЩЕ (bookworm/
  #     trixie: только amd64/arm32v5/arm32v7/arm64v8/i386/...); arm32v6 есть
  #     только в alpine-тегах — но musl-бинарник НЕ запускается на Raspbian
  #     (glibc). Поэтому единственный корректный путь в официальном образном
  #     экосистеме: запустить arm32v7-bookworm-контейнер (нативно на ARM64-
  #     раннере) и собрать CPython 3.14 ИЗ ИСХОДНИКОВ с флагами
  #     -march=armv6 -mfpu=vfp -mfloat-abi=hard (hard-float, как Raspbian),
  #     а затем и вывод Nuitka компилировать теми же флагами (gcc-обёртка).
  #     Результат — НАСТОЯЩИЙ armv6 glibc-бинарник для RPi1/Zero.
  #     Сборка CPython кэшируется между запусками (actions/cache), поэтому
  #     дорого она стоит только при смене версии Python.
  # ==========================================================================
  build-linux-armv6:
    name: Build ${{ matrix.script }} (linux-armv6)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        script: [mozvpn.py, mozvpn_beta.py, mozvpn_no_externals.py]
        include:
          - script: mozvpn.py
            artifact_name: mozvpn-linux-armv6
          - script: mozvpn_beta.py
            artifact_name: mozvpn-beta-linux-armv6
          - script: mozvpn_no_externals.py
            artifact_name: mozvpn-no-externals-linux-armv6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Кэш ccache + собранного armv6-CPython между запусками
      - name: Cache ccache and armv6 CPython (container)
        uses: actions/cache@v6
        with:
          path: |
            .ccache
            .cpython-armv6
          key: armv6-cpython314-ccache-${{ matrix.script }}-${{ github.sha }}
          restore-keys: |
            armv6-cpython314-ccache-${{ matrix.script }}-
            armv6-cpython314-ccache-

      - name: Prepare container build script
        run: |
          cat > ci-build-in-docker.sh <<'EOS'
          set -euo pipefail
          SCRIPT="$1"
          ARTIFACT="$2"
          PYVER="3.14.7"
          PREFIX="/opt/py-armv6"

          apt-get update
          apt-get install -y ccache patchelf build-essential curl xz-utils

          # --- 1) CPython из исходников с armv6-флагами (если нет в кэше) ---
          if [ ! -x "$PREFIX/bin/python3" ]; then
            cd /tmp
            curl -fsSLO "https://www.python.org/ftp/python/$PYVER/Python-$PYVER.tar.xz"
            tar xf "Python-$PYVER.tar.xz"
            cd "Python-$PYVER"
            # armv6 hard-float (ARM1176 = armv6zk + VFPv2) — как Raspbian armhf
            CFLAGS="-march=armv6 -mfpu=vfp -mfloat-abi=hard -O3" \
            ./configure --prefix="$PREFIX" --disable-test-modules
            make -j"$(nproc)"
            make install
          fi
          PY="$PREFIX/bin/python3"

          # --- 2) gcc-обёртка: ВСЁ (CPython-зависимости уже собраны, теперь
          #        C-код Nuitka и onefile-бутстрап) компилируется armv6-флагами.
          #        SCons Nuitka не пробрасывает внешнее окружение, поэтому
          #        обёртка ставится первой в PATH. ---
          mkdir -p /tmp/gcc-armv6
          for c in gcc g++ cc c++; do
            p="$(command -v "$c")"
            [ -n "$p" ] || continue
            cat > "/tmp/gcc-armv6/$c" <<EOF
          #!/bin/bash
          exec $p "\$@" -march=armv6 -mfpu=vfp -mfloat-abi=hard -O3
          EOF
            chmod +x "/tmp/gcc-armv6/$c"
          done
          export PATH="/tmp/gcc-armv6:$PATH"

          # --- 3) Зависимости и сборка Nuitka (armv6-Python) ---
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "Nuitka[app]" ordered-set zstandard
          "$PY" -m pip install pyotp
          "$PY" -m pip install zxing-cpp Pillow proxy.py \
            || echo "optional deps failed on armv6 — building without them"

          INCLUDES=( --include-package=pyotp )
          "$PY" -c "import zxingcpp" 2>/dev/null && INCLUDES+=( --include-package=zxingcpp ) || true
          "$PY" -c "import PIL"       2>/dev/null && INCLUDES+=( --include-package=PIL )       || true
          "$PY" -c "import proxy"     2>/dev/null && INCLUDES+=( --include-package=proxy )     || true

          "$PY" -m nuitka \
            --onefile \
            --output-dir=dist \
            --remove-output \
            --assume-yes-for-downloads \
            --lto=yes \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=test \
            --enable-plugin=anti-bloat \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            "${INCLUDES[@]}" \
            --output-filename="$ARTIFACT" \
            "$SCRIPT"

          # Сохраняем собранный armv6-CPython в кэшируемый каталог (/src = $PWD)
          if [ ! -x /src/.cpython-armv6/bin/python3 ]; then
            mkdir -p /src/.cpython-armv6
            cp -a "$PREFIX/." /src/.cpython-armv6/ || true
          fi
          EOS
          chmod +x ci-build-in-docker.sh

      - name: Build in linux/arm/v7 container (armv6 codegen)
        run: |
          set -euo pipefail
          mkdir -p .ccache .cpython-armv6
          # armv6-CPython из кэша подмонтируем как префикс, если он есть
          MOUNT_CPYTHON=""
          if [ -x .cpython-armv6/bin/python3 ]; then
            mkdir -p cpython-mount
            cp -a .cpython-armv6 cpython-mount/py-armv6
            MOUNT_CPYTHON="-v $PWD/cpython-mount/py-armv6:/opt/py-armv6"
          fi
          docker run --rm \
            --platform linux/arm/v7 \
            -e CCACHE_DIR=/ccache -v "$PWD/.ccache":/ccache \
            -v "$PWD":/src -w /src \
            $MOUNT_CPYTHON \
            python:3.14-bookworm \
            bash ci-build-in-docker.sh "${{ matrix.script }}" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # 3c. Linux armv9 (ARMv9-A: Snapdragon X / новейшие Cortex-A /
  #     Neoverse V2-N3; 64-битный режим). ТЮНИНГОВАННАЯ сборка: armv6/armv7
  #     бинарники работают на ARMv9, но не используют его инструкции
  #     (SVE2, MTE, BTI, crypto) — эта сборка генерирует код под armv9-a.
  #     ВАЖНО: результат НЕ запускается на armv8-устройствах — это цена
  #     тюнинга; универсальной остаётся сборка linux-arm64 (baseline aarch64).
  #     Nuitka не имеет опции передачи CFLAGS, а его SCons не пробрасывает
  #     внешнее окружение, поэтому -march=armv9-a добавляется через
  #     GCC-обёртку в PATH (SCons находит gcc первым в PATH). GCC 12+
  #     поддерживает -march=armv9-a (на ubuntu-24.04 стоит GCC 13).
  #     Тюнятся только C-файлы, сгенерированные Nuitka; интерпретатор
  #     CPython и необязательные расширения остаются baseline-armv8 (это
  #     основная часть кода — ускорение честное, но ограниченное).
  # ==========================================================================
  build-linux-armv9:
    name: Build ${{ matrix.script }} (linux-armv9)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        script: [mozvpn.py, mozvpn_beta.py, mozvpn_no_externals.py]
        include:
          - script: mozvpn.py
            artifact_name: mozvpn-linux-armv9
          - script: mozvpn_beta.py
            artifact_name: mozvpn-beta-linux-armv9
          - script: mozvpn_no_externals.py
            artifact_name: mozvpn-no-externals-linux-armv9

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-armv9-${{ matrix.script }}-${{ github.sha }}
          restore-keys: |
            ccache-armv9-${{ matrix.script }}-

      - name: Set up Python (arm64)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: arm64

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache patchelf build-essential

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "Nuitka[app]" ordered-set zstandard
          python -m pip install pyotp
          python -m pip install zxing-cpp Pillow proxy.py \
            || echo "::warning::optional deps failed — building without them"

      - name: Prepare armv9-tuned gcc wrapper
        run: |
          set -euo pipefail
          # Обёртки добавляют armv9-флаги КО ВСЕМ вызовам gcc/g++:
          # Nuitka вызывает компилятор из PATH через SCons.
          mkdir -p "$HOME/gcc-armv9"
          for c in gcc g++ cc c++ gcc-13 g++-13; do
            command -v "$c" >/dev/null 2>&1 || continue
            cat > "$HOME/gcc-armv9/$c" <<EOF
          #!/bin/bash
          exec $(command -v $c) "\$@" -march=armv9-a -mtune=generic-armv9-a -O3
          EOF
            chmod +x "$HOME/gcc-armv9/$c"
          done
          echo "$HOME/gcc-armv9" >> "$GITHUB_PATH"
          # Быстрая проверка, что флаги принимаются этим GCC:
          echo 'int main(){return 0;}' > /tmp/t.c
          gcc /tmp/t.c -o /tmp/t.out && /tmp/t.out
          echo "armv9 gcc wrapper OK: $(gcc -dumpmachine)"

      - name: Build with Nuitka (armv9-tuned)
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="${{ matrix.script }}"
          INCLUDES=( --include-package=pyotp )
          python -c "import zxingcpp" 2>/dev/null && INCLUDES+=( --include-package=zxingcpp ) || true
          python -c "import PIL"       2>/dev/null && INCLUDES+=( --include-package=PIL )       || true
          python -c "import proxy"     2>/dev/null && INCLUDES+=( --include-package=proxy )     || true
          python -m nuitka \
            --onefile \
            --output-dir=dist \
            --remove-output \
            --assume-yes-for-downloads \
            --lto=yes \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=test \
            --enable-plugin=anti-bloat \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            "${INCLUDES[@]}" \
            --output-filename="${{ matrix.artifact_name }}" \
            "$SCRIPT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # 4. Android (Termux / bionic) — Nuitka официально поддерживает Android
  #    через Termux (user manual: "pkg install patchelf ccache binutils ldd
  #    termux-elf-cleaner"). Собираем в официальном образе
  #    termux/termux-docker — тот же пакетный набор, что и на реальном
  #    устройстве, поэтому бинарник работает и в Termux на Android,
  #    включая Android-x86 (тег x86_64).
  #    aarch64-тег запускается нативно на ARM-раннере, x86_64 — на x64-раннере
  #    (эмуляция не нужна).
  #    Сборка экспериментальная: continue-on-error — фейл джобы Android
  #    не ломает релиз остальных платформ.
  # ==========================================================================
  build-android:
    name: Build ${{ matrix.script }} (android-${{ matrix.termux_tag }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        script: [mozvpn.py, mozvpn_beta.py, mozvpn_no_externals.py]
        termux_tag: [x86_64, aarch64]
        include:
          # Какой раннер запускать для какого тега Termux (нативно, без QEMU)
          - termux_tag: x86_64
            os: ubuntu-latest
          - termux_tag: aarch64
            os: ubuntu-24.04-arm
          # Правила именования артефактов
          - script: mozvpn.py
            termux_tag: x86_64
            artifact_name: mozvpn-android-x86_64
          - script: mozvpn.py
            termux_tag: aarch64
            artifact_name: mozvpn-android-aarch64
          - script: mozvpn_beta.py
            termux_tag: x86_64
            artifact_name: mozvpn-beta-android-x86_64
          - script: mozvpn_beta.py
            termux_tag: aarch64
            artifact_name: mozvpn-beta-android-aarch64
          - script: mozvpn_no_externals.py
            termux_tag: x86_64
            artifact_name: mozvpn-no-externals-android-x86_64
          - script: mozvpn_no_externals.py
            termux_tag: aarch64
            artifact_name: mozvpn-no-externals-android-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Кэш ccache между запусками (монтируется в Termux-контейнер)
      - name: Cache ccache (Termux)
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-termux-${{ matrix.termux_tag }}-${{ matrix.script }}-${{ github.sha }}
          restore-keys: |
            ccache-termux-${{ matrix.termux_tag }}-${{ matrix.script }}-

      - name: Prepare Termux build script
        run: |
          cat > termux-build.sh <<'EOS'
          set -euo pipefail
          SCRIPT="$1"
          ARTIFACT="$2"

          # Termux-окружение: пакеты те же, что рекомендует
          # документация Nuitka для Android.
          pkg install -y python patchelf ccache binutils ldd termux-elf-cleaner

          pip install --upgrade pip
          pip install "Nuitka[app]" ordered-set zstandard
          pip install pyotp
          pip install zxing-cpp Pillow proxy.py \
            || echo "optional deps failed in Termux — building without them"

          INCLUDES=( --include-package=pyotp )
          python -c "import zxingcpp" 2>/dev/null && INCLUDES+=( --include-package=zxingcpp ) || true
          python -c "import PIL"       2>/dev/null && INCLUDES+=( --include-package=PIL )       || true
          python -c "import proxy"     2>/dev/null && INCLUDES+=( --include-package=proxy )     || true

          mkdir -p ~/work
          cp "/host-src/$SCRIPT" ~/work/
          cd ~/work

          python -m nuitka \
            --onefile \
            --output-dir=dist \
            --remove-output \
            --assume-yes-for-downloads \
            --lto=yes \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=test \
            --enable-plugin=anti-bloat \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            "${INCLUDES[@]}" \
            --output-filename="$ARTIFACT" \
            "$SCRIPT"

          cp "dist/$ARTIFACT" /host-dist/
          EOS

          # Каталоги, доступные контейнеру: исходники (чтение) и вывод (запись).
          mkdir -p dist-host
          chmod 777 dist-host

      - name: Build in Termux container (${{ matrix.termux_tag }})
        timeout-minutes: 300
        run: |
          docker run --rm \
            -e CCACHE_DIR=/ccache -v "$PWD/.ccache":/ccache \
            -v "$PWD":/host-src:ro \
            -v "$PWD/dist-host":/host-dist \
            termux/termux-docker:${{ matrix.termux_tag }} \
            bash /host-src/termux-build.sh \
              "${{ matrix.script }}" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-host/${{ matrix.artifact_name }}
          if-no-files-found: warn
          retention-days: 7

  # ==========================================================================
  # 5. Release: собирает ВСЕ артефакты со ВСЕХ архитектур
  # ==========================================================================
  release:
    name: Create GitHub Release
    needs: [build, build-linux-i386, build-linux-armv5, build-linux-armv7, build-linux-armv6, build-linux-armv9, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          # ---- Windows x64 ----
          cp artifacts/mozvpn-windows.exe/mozvpn-windows.exe release/ || true
          cp artifacts/mozvpn-beta-windows.exe/mozvpn-beta-windows.exe release/ || true
          cp artifacts/mozvpn-no-externals-windows.exe/mozvpn-no-externals-windows.exe release/ || true
          # ---- Windows x86 (32-bit) ----
          cp artifacts/mozvpn-windows-x86.exe/mozvpn-windows-x86.exe release/ || true
          cp artifacts/mozvpn-beta-windows-x86.exe/mozvpn-beta-windows-x86.exe release/ || true
          cp artifacts/mozvpn-no-externals-windows-x86.exe/mozvpn-no-externals-windows-x86.exe release/ || true
          # ---- Linux x64 ----
          cp artifacts/mozvpn-linux/mozvpn-linux release/ || true
          cp artifacts/mozvpn-beta-linux/mozvpn-beta-linux release/ || true
          cp artifacts/mozvpn-no-externals-linux/mozvpn-no-externals-linux release/ || true
          # ---- Linux arm64 ----
          cp artifacts/mozvpn-linux-arm64/mozvpn-linux-arm64 release/ || true
          cp artifacts/mozvpn-beta-linux-arm64/mozvpn-beta-linux-arm64 release/ || true
          cp artifacts/mozvpn-no-externals-linux-arm64/mozvpn-no-externals-linux-arm64 release/ || true
          # ---- Linux armv7 (старые ARM-устройства) ----
          cp artifacts/mozvpn-linux-armv7/mozvpn-linux-armv7 release/ || true
          cp artifacts/mozvpn-beta-linux-armv7/mozvpn-beta-linux-armv7 release/ || true
          cp artifacts/mozvpn-no-externals-linux-armv7/mozvpn-no-externals-linux-armv7 release/ || true
          # ---- Linux armv6 (ARM11: Raspberry Pi 1/Zero и т.п.) ----
          cp artifacts/mozvpn-linux-armv6/mozvpn-linux-armv6 release/ || true
          cp artifacts/mozvpn-beta-linux-armv6/mozvpn-beta-linux-armv6 release/ || true
          cp artifacts/mozvpn-no-externals-linux-armv6/mozvpn-no-externals-linux-armv6 release/ || true
          # ---- Linux armv5 (самые старые ARM: ARM9/ARM10) ----
          cp artifacts/mozvpn-linux-armv5/mozvpn-linux-armv5 release/ || true
          cp artifacts/mozvpn-beta-linux-armv5/mozvpn-beta-linux-armv5 release/ || true
          cp artifacts/mozvpn-no-externals-linux-armv5/mozvpn-no-externals-linux-armv5 release/ || true
          # ---- Linux armv9 (тюнингованная сборка, только ARMv9-A CPU) ----
          cp artifacts/mozvpn-linux-armv9/mozvpn-linux-armv9 release/ || true
          cp artifacts/mozvpn-beta-linux-armv9/mozvpn-beta-linux-armv9 release/ || true
          cp artifacts/mozvpn-no-externals-linux-armv9/mozvpn-no-externals-linux-armv9 release/ || true
          # ---- Linux i386 (старые 32-битные x86) ----
          cp artifacts/mozvpn-linux-i386/mozvpn-linux-i386 release/ || true
          cp artifacts/mozvpn-beta-linux-i386/mozvpn-beta-linux-i386 release/ || true
          cp artifacts/mozvpn-no-externals-linux-i386/mozvpn-no-externals-linux-i386 release/ || true
          # ---- Android x86_64 (Android-x86 и Termux на x86) ----
          cp artifacts/mozvpn-android-x86_64/mozvpn-android-x86_64 release/ || true
          cp artifacts/mozvpn-beta-android-x86_64/mozvpn-beta-android-x86_64 release/ || true
          cp artifacts/mozvpn-no-externals-android-x86_64/mozvpn-no-externals-android-x86_64 release/ || true
          # ---- Android aarch64 (ARM-устройства) ----
          cp artifacts/mozvpn-android-aarch64/mozvpn-android-aarch64 release/ || true
          cp artifacts/mozvpn-beta-android-aarch64/mozvpn-beta-android-aarch64 release/ || true
          cp artifacts/mozvpn-no-externals-android-aarch64/mozvpn-no-externals-android-aarch64 release/ || true
          ls -la release/

      - name: Create Release & upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
