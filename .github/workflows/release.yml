name: Build mozvpn_beta with Nuitka

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prebuilt (never built from source) CPython 3.14.x - latest stable:
#   Linux      - already inside official python.org Docker images
#                  x86_64: python:3.14-slim-trixie (multi-arch official image)
#                  arm64 : arm64v8/python:3.14-slim-trixie (official per-arch image)
#                  armv7 : arm32v7/python:3.14-slim-trixie (official per-arch image)
#   Windows    - official python.org installers via actions/setup-python
# Python packages (nuitka, zstandard, project deps) - latest stable from PyPI.
# C compiler on Linux - latest stable Clang from the official LLVM apt
# repository (apt.llvm.org), branch 22, wired up by the official llvm.sh script.
# NOTE: there is no "--onefile-compression" option in Nuitka. Onefile payload
# compression is enabled automatically when the "zstandard" package is
# installed in the build environment; installing "nuitka[onefile]" is the
# officially recommended way to pull it in.
# NOTE: mozvpn_beta.py calls pip at runtime to install dependencies, so pip
# and setuptools are compiled INTO the binary (--include-package=pip,
# --include-package=setuptools), and all known project dependencies are
# pre-installed at build time so Nuitka can compile them in as well.
env:
  PYTHON_VERSION: '3.14'
  LLVM_VERSION: '22'
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------
  # Linux (native runners, container jobs):
  # Official python:3.14-slim-trixie image (Debian 13 "trixie" - current
  # stable Debian; Python 3.14.x is the prebuilt python.org build).
  # System packages: apt (native Debian package manager).
  # C compiler: official LLVM apt repository (apt.llvm.org), branch 22,
  # connected by the official llvm.sh script from apt.llvm.org.
  # -----------------------------------------------------------------
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - official multi-arch python image
          - name: linux-x64
            runner: ubuntu-26.04
            image: python:3.14-slim-trixie
            platform: linux-x64
            artifact: mozvpn_beta-linux-x64
          # Linux ARMv8 (aarch64) - official per-arch arm64v8 image
          # on the native arm64 runner (free for public repositories)
          - name: linux-arm64
            runner: ubuntu-26.04-arm
            image: arm64v8/python:3.14-slim-trixie
            platform: linux-arm64
            artifact: mozvpn_beta-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update system and install base tools via apt (native Debian package manager)
        run: |
          set -euxo pipefail
          apt-get update
          # Upgrade all system packages to the latest stable versions of the release
          apt-get upgrade -y
          # Base build tools for Nuitka: C toolchain, ccache, patchelf
          apt-get install -y --no-install-recommends \
            build-essential ccache patchelf ca-certificates curl gnupg lsb-release git

      - name: Verify preinstalled Python 3.14
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
          python3 -m pip --version

      - name: Install latest stable Clang from the official LLVM apt repository
        run: |
          set -euxo pipefail
          # Official LLVM repository bootstrap script (apt.llvm.org)
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh ${{ env.LLVM_VERSION }} all
          # Make sure clang is available
          clang-${{ env.LLVM_VERSION }} --version
          ln -sf "$(command -v clang-${{ env.LLVM_VERSION }})" /usr/local/bin/clang
          ln -sf "$(command -v clang++-${{ env.LLVM_VERSION }})" /usr/local/bin/clang++
          clang --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-

      - name: Install Python dependencies (latest stable from PyPI)
        run: |
          set -euxo pipefail
          python3 -m pip install --no-cache-dir --upgrade pip
          # Pre-install project dependencies so Nuitka compiles them into
          # the binary; the script also installs deps via pip at runtime.
          if [ -f requirements.txt ]; then
            python3 -m pip install --no-cache-dir --upgrade -r requirements.txt
          fi
          # Nuitka with the "onefile" extra pulls in "zstandard", which
          # enables automatic onefile payload compression.
          python3 -m pip install --no-cache-dir --upgrade "nuitka[onefile]" ordered-set

      - name: Compile with Nuitka (optimized onefile, Clang + LTO)
        run: |
          set -euxo pipefail
          mkdir -p build
          python3 -m nuitka \
            --clang \
            --mode=onefile \
            --lto=yes \
            --assume-yes-for-downloads \
            --include-package=pip \
            --include-package=setuptools \
            --output-dir=build \
            --output-filename=mozvpn_beta-${{ matrix.platform }} \
            --product-name="mozvpn_beta" \
            --file-version=1.0.0 \
            --product-version=1.0.0 \
            --report=build/compilation-report.xml \
            mozvpn_beta.py

      - name: Smoke test (run the binary with --help, if supported)
        run: |
          chmod +x "build/mozvpn_beta-${{ matrix.platform }}"
          "build/mozvpn_beta-${{ matrix.platform }}" --help || true
        continue-on-error: true

      - name: Verify output
        run: |
          file "build/mozvpn_beta-${{ matrix.platform }}"
          ls -lh "build/mozvpn_beta-${{ matrix.platform }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/mozvpn_beta-${{ matrix.platform }}
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Linux ARMv7 (32-bit ARM):
  # There is no native armv7 GitHub-hosted runner, and Nuitka cannot
  # cross-compile, so this job runs the official arm32v7/python image
  # (Debian 13 trixie, prebuilt python.org CPython 3.14.7) under QEMU
  # emulation on an x64 runner via Docker.
  # System packages: apt (native Debian package manager).
  # C compiler: official LLVM apt repository (apt.llvm.org), branch 22.
  # -----------------------------------------------------------------
  build-linux-armv7:
    name: linux-armv7
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Build inside the official arm32v7/python container
        run: |
          set -euxo pipefail
          docker run --rm \
            --platform linux/arm/v7 \
            -e DEBIAN_FRONTEND=noninteractive \
            -e LLVM_VERSION="${LLVM_VERSION}" \
            -v "$PWD:/src" \
            -w /src \
            arm32v7/python:3.14-slim-trixie \
            bash -c '
              set -euxo pipefail
              # Update system packages with apt (native Debian package manager)
              apt-get update
              apt-get upgrade -y
              apt-get install -y --no-install-recommends \
                build-essential ccache patchelf ca-certificates curl gnupg lsb-release git
              # Verify the prebuilt Python 3.14
              python3 --version
              python3 -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
              # Latest stable Clang from the official LLVM apt repository
              curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
              chmod +x /tmp/llvm.sh
              /tmp/llvm.sh "${LLVM_VERSION}" all
              ln -sf "$(command -v clang-${LLVM_VERSION})" /usr/local/bin/clang
              ln -sf "$(command -v clang++-${LLVM_VERSION})" /usr/local/bin/clang++
              clang --version
              # Python dependencies - latest stable from PyPI.
              # Pre-install project deps so Nuitka compiles them in; the
              # script also installs deps via pip at runtime.
              python3 -m pip install --no-cache-dir --upgrade pip
              if [ -f requirements.txt ]; then
                python3 -m pip install --no-cache-dir --upgrade -r requirements.txt
              fi
              # nuitka[onefile] pulls in zstandard -> automatic onefile compression
              python3 -m pip install --no-cache-dir --upgrade "nuitka[onefile]" ordered-set
              # Compile with Nuitka (optimized onefile, Clang + LTO).
              # pip/setuptools are included because the script calls pip at runtime.
              mkdir -p /src/build
              python3 -m nuitka \
                --clang \
                --mode=onefile \
                --lto=yes \
                --assume-yes-for-downloads \
                --include-package=pip \
                --include-package=setuptools \
                --output-dir=/src/build \
                --output-filename=mozvpn_beta-linux-armv7 \
                --product-name="mozvpn_beta" \
                --file-version=1.0.0 \
                --product-version=1.0.0 \
                --report=/src/build/compilation-report.xml \
                mozvpn_beta.py
            '
        env:
          LLVM_VERSION: ${{ env.LLVM_VERSION }}

      - name: Smoke test (run the binary with --help, if supported)
        run: |
          chmod +x build/mozvpn_beta-linux-armv7
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/src" -w /src \
            arm32v7/python:3.14-slim-trixie \
            ./build/mozvpn_beta-linux-armv7 --help || true
        continue-on-error: true

      - name: Verify output
        run: |
          file build/mozvpn_beta-linux-armv7
          ls -lh build/mozvpn_beta-linux-armv7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mozvpn_beta-linux-armv7
          path: build/mozvpn_beta-linux-armv7
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Windows: prebuilt python.org CPython installers via
  # actions/setup-python. x86 (32-bit) builds on windows-latest with the
  # 32-bit CPython + MSVC (32-bit VS tools are part of the VS install on
  # the runner). arm64 - native windows-11-arm runner (free for public
  # repositories only). Compiler: MSVC; Nuitka downloads ccache/clcache
  # from an official source by itself (--assume-yes-for-downloads).
  # -----------------------------------------------------------------
  build-windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            python-arch: x64
            platform: windows-x64
            artifact: mozvpn_beta-windows-x64
          - name: windows-x86
            os: windows-latest
            python-arch: x86
            platform: windows-x86
            artifact: mozvpn_beta-windows-x86
          - name: windows-arm64
            os: windows-11-arm
            python-arch: arm64
            platform: windows-arm64
            artifact: mozvpn_beta-windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }} (${{ matrix.python-arch }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python-arch }}
          cache: 'pip'

      - name: Install Python dependencies (latest stable from PyPI)
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          # Pre-install project dependencies so Nuitka compiles them into
          # the binary; the script also installs deps via pip at runtime.
          if (Test-Path requirements.txt) {
            pip install --no-cache-dir --upgrade -r requirements.txt
          }
          # nuitka[onefile] pulls in zstandard -> automatic onefile compression
          pip install --no-cache-dir --upgrade "nuitka[onefile]" ordered-set

      - name: Compile with Nuitka (optimized onefile, MSVC + LTO)
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=onefile `
            --lto=yes `
            --assume-yes-for-downloads `
            --include-package=pip `
            --include-package=setuptools `
            --output-dir=build `
            --output-filename=mozvpn_beta-${{ matrix.platform }}.exe `
            --product-name="mozvpn_beta" `
            --file-version=1.0.0 `
            --product-version=1.0.0 `
            --company-name="hdjsndjdkjshznkajs1255" `
            --report=build/compilation-report.xml `
            mozvpn_beta.py

      - name: Smoke test (run the binary with --help, if supported)
        shell: pwsh
        run: |
          $bin = "build/mozvpn_beta-${{ matrix.platform }}.exe"
          if (Test-Path $bin) { & $bin --help }
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/mozvpn_beta-${{ matrix.platform }}.exe
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Release: all artifacts are published to a GitHub Release when a v* tag is pushed
  # -----------------------------------------------------------------
  release:
    name: Publish release (tags only)
    needs: [build-linux, build-linux-armv7, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
