# ============================================================================
# Free Mozilla VPN — build mozvpn_beta.py with Nuitka (Python 3.14)
#
# Targets (unified uname-style naming, identical for every OS):
#   linux-x86_64   — 64-bit Intel/AMD Linux (a.k.a. x64 / amd64)
#   linux-x86      — 32-bit Linux (i386/i686)
#   linux-arm64    — 64-bit ARM Linux (= ARMv8-A, aarch64)
#   windows-x86_64 — 64-bit Intel/AMD Windows (a.k.a. x64)
#   windows-x86    — 32-bit Windows (i386/i686)
#   windows-arm64  — 64-bit ARM Windows (= ARMv8; Windows 11 on Arm)
#
# NOTE: linux-armv7 (32-bit ARM / armhf) is intentionally NOT built in this
# variant: it requires QEMU emulation on the x86_64 runner, which makes the
# Nuitka build extremely slow and unreliable within the 360-minute
# hosted-runner job limit. 32-bit ARM users can run the arm64 binary on
# most armv8 hardware; if armv7 support is ever needed, re-add the
# emulated container job (docker/setup-qemu-action + `docker run
# --platform linux/arm/v7`), with `make` and `ccache` apt-installed
# (gcc LTO links SERIALLY without make — Nuitka#3238) and an explicit
# `timeout-minutes: 350`.
#
# ---------------------------------------------------------------------------
# FIXES IN THIS REVISION (audited 2026-09-24, all facts verified online):
#
# FIX 1 (THE windows-arm64 FATAL, and a latent bomb in EVERY other job):
#     "FATAL: Error, failed to locate package 'setuptools' you asked to
#      include."  Root cause: since Python 3.12 the CPython distributions
#      installed by actions/setup-python (and the official python Docker
#      images) NO LONGER BUNDLE setuptools — ensurepip/venv install only
#      pip (python/cpython#95299, python-build-standalone#300). Nuitka's
#      --include-package=setuptools therefore fails whenever setuptools
#      is not explicitly pip-installed into the BUILD environment. On some
#      x86_64 images setuptools happened to still be present (leftover /
#      preinstalled by other tooling), which is why only windows-arm64
#      blew up first — but the same crash could hit any matrix cell.
#      Fix: `pip install --upgrade pip setuptools wheel` is now run in
#      EVERY build job (matrix job + the i386 container job), BEFORE nuitka.
#
# FIX 5 (linux-x86 FATAL):
#     "error: failed-wheel-build-for-install ... cffi ... ffi.h: No such
#      file or directory". Chain: on CPython 3.14 zstandard has no
#      prebuilt wheel for i386, so pip builds it from source; per
#      the python-zstandard documentation, on Python 3.14 the package
#      uses the CFFI backend/bindings, i.e. its build requires
#      cffi>=2.0.0b; cffi compiles its _cffi_backend C extension, which
#      #includes <ffi.h> — the header lives in the libffi-dev system
#      package, which python:*-slim images do NOT contain. Fix:
#      `libffi-dev` is now installed via apt in the i386 container job,
#      plus a fallback: if `pip install zstandard` still fails, the
#      build continues WITHOUT zstandard; per the Nuitka user manual the
#      onefile payload is then packed UNCOMPRESSED (compression applies
#      only when zstandard is available); zstandard is optional build
#      tooling. `make` is installed as well: gcc LTO requires it for
#      parallel LTRANS linking (Nuitka#3238) — on native x86 it is only
#      a speedup, but it also silences the Nuitka warning.
#
# FIX 2: generate_release_notes had a corrupted value ("truedeep-research"
#      paste artifact) — restored to `true`.
#
# FIX 3: the release-bundle job used `always()` in its `if`, so it also ran
#      after FAILED builds (producing a broken/empty release zip and a
#      failing download-artifact step). Now the bundle is built only when
#      all `needs` jobs succeeded.
#
# Everything else verified and kept as-is:
#   * actions/checkout@v5, actions/setup-python@v6,
#     actions/upload-artifact@v7, actions/download-artifact@v8,
#     softprops/action-gh-release@v3 — all are current, valid major tags.
#   * setup-python DOES provide pre-built CPython 3.14 for x64 and x86 on
#     windows-latest and for arm64 on windows-11-arm.
#   * Tag filter "release/**" (a single "*" does NOT match "/" in
#     tags/branches filters); a tag push uses the workflow file FROM THE
#     COMMIT the tag points at; the `release` event uses the DEFAULT
#     branch's file and cannot be filtered by tag (handled via the
#     release-bundle job's `if`).
#   * No requirements.txt/pyproject.toml exists in this repo, so
#     `cache: pip` in setup-python is NOT used (it hard-fails when the
#     dependency glob matches nothing — actions/setup-python#807).
#   * jobs.<id>.container CANNOT be used for the 32-bit build:
#     the runner mounts only 64-bit node binaries into /__e/, so in an
#     i386 job container every action dies with
#     "exec /__e/node24/bin/node: no such file or directory"
#     (actions/runner#2115). All actions therefore run on the host and
#     the build runs via plain `docker run` with the workspace bind-mounted.
#   * linux-x86 runs natively on the x86_64 kernel — no emulation needed.
#   * Nuitka officially supports Python 3.4–3.14 and does NOT
#     cross-compile; every target is built natively on a hosted runner
#     with a PRE-BUILT CPython — nothing is compiled from source.
#   * For 32-bit Python on Windows, Nuitka requires MSVC (NOT MinGW);
#     MSVC is preinstalled on windows-latest, and the windows-11-arm image
#     ships Visual Studio with ARM64 build tools.
#   * --include-package=pip / =setuptools is required because
#     mozvpn_beta.py runs pip AT RUNTIME to install its dependencies,
#     and Nuitka standalone does not bundle pip/setuptools by default.
# ============================================================================

name: Build Free Mozilla VPN

on:
  push:
    # Main branch plus release branches (e.g. release/1.2.20).
    # NOTE: for branches a single "*" already matches slashes, but
    # "release/**" is used for clarity and symmetry with the tag filter.
    branches: ["main", "release/**"]
    # "**" DOES match "/" in these filters; "release/*" would NOT match
    # the hierarchical tag "release/1.2.20". Keep "release/**" here.
    tags: ["v*", "release/**"]
  pull_request:
  # Fires when a GitHub Release is published (uses the workflow file
  # from the DEFAULT branch; cannot be filtered by tag name — the
  # release-bundle job's `if` handles that).
  release:
    types: [published]
  workflow_dispatch:

env:
  APP_NAME: "Free Mozilla VPN"
  SCRIPT: mozvpn_beta.py
  PYTHON_VERSION: "3.14"
  # Version used for Windows binary resources
  FILE_VERSION: "1.0.0.0"

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Main matrix: targets that run directly on hosted runners using a
  # pre-built CPython from setup-python.
  # --------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- Linux x86_64 (64-bit Intel/AMD; a.k.a. x64/amd64) -----
          - os: ubuntu-latest
            target: linux-x86_64
            python_arch: x64
          # ----- Linux arm64 (= ARMv8-A / aarch64; free for public repos) -----
          - os: ubuntu-24.04-arm
            target: linux-arm64
            python_arch: arm64
          # ----- Windows x86_64 (64-bit Intel/AMD; a.k.a. x64) -----
          - os: windows-latest
            target: windows-x86_64
            python_arch: x64
          # ----- Windows arm64 (= ARMv8; free for public repositories) -----
          - os: windows-11-arm
            target: windows-arm64
            python_arch: arm64
          # ----- Windows x86 (32-bit CPython via architecture: x86) -----
          - os: windows-latest
            target: windows-x86
            python_arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # NOTE: no cache: pip here — the repo has no requirements.txt or
      # pyproject.toml, and setup-python fails hard when the cache
      # dependency glob matches nothing.
      - name: Set up Python ${{ env.PYTHON_VERSION }} (${{ matrix.python_arch }})
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Install project dependencies only if a requirements file exists.
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          else
            echo "No requirements.txt found — installing only build tooling."
          fi
          # -----------------------------------------------------------------
          # FIX (was the windows-arm64 FATAL):
          # Python 3.12+ CPython from setup-python no longer bundles
          # setuptools, and Nuitka --include-package=setuptools hard-fails
          # with "failed to locate package 'setuptools'" when it is not
          # installed. Install it EXPLICITLY, on every OS/arch, before nuitka.
          # -----------------------------------------------------------------
          python -m pip install --upgrade pip setuptools wheel
          # Build tooling: Nuitka compiler + helpers for onefile compression.
          python -m pip install --upgrade nuitka ordered-set
          # zstandard: optional onefile compressor. Prebuilt wheels cover
          # the common matrix targets, but if a cell has no wheel (e.g.
          # Windows arm64), do NOT fail the build: the onefile payload
          # is just packed UNCOMPRESSED, per the Nuitka user manual.
          python -m pip install --upgrade zstandard || \
            echo "WARNING: zstandard install failed — continuing without it (Nuitka will pack the onefile payload uncompressed)."

      - name: Install C compiler cache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang

      - name: Show toolchain info
        shell: bash
        run: |
          python --version
          python -c "import platform, sysconfig; print(platform.machine(), sysconfig.get_platform())"
          # Prove that pip AND setuptools are importable in the build env
          # (the exact precondition for --include-package=pip/setuptools).
          python -c "import pip, setuptools, wheel; print('pip', pip.__version__, '| setuptools', setuptools.__version__)"
          python -m nuitka --version

      # ------------------------------------------------------------------------
      # Nuitka build with optimizations:
      #   --standalone        : self-contained environment (no installed Python
      #                         required on the target machine)
      #   --onefile           : a single self-sufficient executable file
      #   --lto=yes           : whole-program link-time optimization
      #   --clang (Linux)     : clang is faster and more memory-efficient
      #                         than gcc
      #   --remove-output     : delete the temporary build folder
      #   --assume-yes-for-downloads : let Nuitka download ccache and other
      #                         optional tooling automatically when needed
      #   --include-package=pip / =setuptools : mozvpn_beta.py runs pip
      #                         at runtime to install its dependencies,
      #                         and Nuitka standalone does NOT include
      #                         pip/setuptools by default — they must be
      #                         explicitly bundled into the binary. Both
      #                         packages must be installed in the BUILD
      #                         environment (see the Install dependencies
      #                         step) or Nuitka aborts with FATAL.
      #
      # Windows note: Nuitka uses the preinstalled MSVC (Build Tools) on
      # windows-latest runners; for the 32-bit Python (x86) target MSVC is
      # required — MinGW must not be used there. The windows-11-arm image
      # ships Visual Studio with ARM64 build tools for the arm64 target.
      # ------------------------------------------------------------------------
      - name: Compile with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --include-package=pip \
            --include-package=setuptools \
            --clang \
            --jobs=4 \
            --output-dir=build \
            --output-filename="mozvpn_beta-${{ matrix.target }}" \
            --company-name="${{ env.APP_NAME }}" \
            --product-name="${{ env.APP_NAME }}" \
            --file-description="${{ env.APP_NAME }} (mozvpn_beta)" \
            --file-version="${{ env.FILE_VERSION }}" \
            --product-version="${{ env.FILE_VERSION }}" \
            --remove-output \
            --assume-yes-for-downloads \
            "${{ env.SCRIPT }}"

      - name: Compile with Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m nuitka `
            --standalone `
            --onefile `
            --lto=yes `
            --include-package=pip `
            --include-package=setuptools `
            --jobs=4 `
            --output-dir=build `
            --output-filename="mozvpn_beta-${{ matrix.target }}.exe" `
            --company-name="${{ env.APP_NAME }}" `
            --product-name="${{ env.APP_NAME }}" `
            --file-description="${{ env.APP_NAME }} (mozvpn_beta)" `
            --file-version="${{ env.FILE_VERSION }}" `
            --product-version="${{ env.FILE_VERSION }}" `
            --copyright="${{ env.APP_NAME }}" `
            --windows-console-mode=force `
            --remove-output `
            --assume-yes-for-downloads `
            "${{ env.SCRIPT }}"

      - name: Smoke test binary (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          file "build/mozvpn_beta-${{ matrix.target }}"
          # --help/-h works because the script uses argparse.
          "./build/mozvpn_beta-${{ matrix.target }}" --help || true

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "build/mozvpn_beta-${{ matrix.target }}.exe"
          if (Test-Path $bin) {
            # Non-fatal on purpose: an interactive console app may return
            # a non-zero exit code from --help; the build result is the
            # binary itself, which Test-Path already proved exists.
            & $bin --help
            Write-Host "smoke exit=$LASTEXITCODE"
          } else {
            throw "Binary not found: $bin"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mozvpn_beta-${{ matrix.target }}
          path: build/mozvpn_beta-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Linux x86 (32-bit): there is no 32-bit hosted runner and setup-python
  # does not provide 32-bit CPython for Linux, BUT nothing is built from
  # source. The official python Docker image is multi-arch and publishes
  # pre-built 32-bit (i386) CPython builds, so this job runs the build in
  # an i386 container on the regular x86_64 ubuntu-latest runner (the
  # x86_64 kernel executes 32-bit code natively, no emulation).
  #
  # IMPORTANT: jobs.<id>.container CANNOT be used for a 32-bit container.
  # Action steps run inside the job container and need Node.js there, but
  # the runner mounts only 64-bit node binaries into /__e/ — in an i386
  # container every action (even checkout) dies with
  # "exec /__e/node24/bin/node: no such file or directory"
  # (actions/runner#2115, actions/upload-artifact#616). Therefore all
  # actions run on the host, and the build itself runs via plain
  # `docker run` with the workspace bind-mounted.
  # --------------------------------------------------------------------------
  build-linux-x86:
    name: Build linux-x86 (32-bit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The build runs inside the i386 container via plain `docker run`
      # (see the comment above for why jobs.container is not usable).
      # The workspace is bind-mounted so the resulting binary is directly
      # visible to the runner for the artifact upload step.
      - name: Compile with Nuitka (32-bit Linux, inside i386 container)
        run: |
          set -euo pipefail
          # NOTE: the workflow-level env block is exported into run-step
          # shells, so ${PYTHON_VERSION} expands correctly here (host shell).
          docker run --rm \
            --platform linux/386 \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            "python:${PYTHON_VERSION}-slim" \
            bash -euo pipefail -c '
              # Pre-built packages only — nothing compiled from sources.
              # FIX: libffi-dev provides <ffi.h> — required to build cffi,
              # which is required to build zstandard on Python 3.14
              # (CFFI backend, no prebuilt i386 cp314 wheels).
              # make: gcc LTO requires it for parallel LTRANS linking
              # (Nuitka#3238); x86 runs natively so it is only a speedup
              # here, but it also silences the Nuitka warning.
              apt-get update
              apt-get install -y --no-install-recommends \
                gcc g++ make ccache patchelf file libffi-dev
              python --version
              python -c "import platform; print(\"arch:\", platform.machine())"
              # Install project dependencies only if a requirements file exists.
              if [ -f requirements.txt ]; then
                python -m pip install --upgrade pip
                python -m pip install -r requirements.txt
              else
                echo "No requirements.txt found — installing only build tooling."
              fi
              # FIX: Python 3.12+ images do not bundle setuptools any more;
              # Nuitka --include-package=setuptools requires it in the build env.
              python -m pip install --upgrade pip setuptools wheel
              # Build tooling: Nuitka compiler + onefile compression helpers.
              python -m pip install --upgrade nuitka ordered-set
              # zstandard: optional onefile compressor. On Python 3.14 it may
              # have to build from source via cffi (no wheel for this arch) —
              # libffi-dev (installed above) makes that succeed. If it still
              # fails, continue WITHOUT it: the onefile payload is packed
              # UNCOMPRESSED; the binary stays fully functional.
              python -m pip install --upgrade zstandard || \
                echo "WARNING: zstandard install failed — continuing without it (Nuitka will pack the onefile payload uncompressed)."
              # Prove pip/setuptools are importable (precondition for the
              # --include-package options below).
              python -c "import pip, setuptools, wheel; print(\"pip+setuptools OK\")"
              python -m nuitka \
                --standalone \
                --onefile \
                --lto=yes \
                --include-package=pip \
                --include-package=setuptools \
                --jobs=4 \
                --output-dir=build \
                --output-filename="mozvpn_beta-linux-x86" \
                --company-name="Free Mozilla VPN" \
                --product-name="Free Mozilla VPN" \
                --file-description="Free Mozilla VPN (mozvpn_beta)" \
                --file-version="1.0.0.0" \
                --product-version="1.0.0.0" \
                --remove-output \
                --assume-yes-for-downloads \
                "mozvpn_beta.py"
              # Smoke test: --help/-h works because the script uses argparse.
              file build/mozvpn_beta-linux-x86
              ./build/mozvpn_beta-linux-x86 --help || true
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mozvpn_beta-linux-x86
          path: build/mozvpn_beta-linux-x86*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Release: collects all binaries into a single zip (for v* tags,
  # release/** tags, or a published GitHub Release).
  #
  # NOTE: no `always()` here on purpose. With `always()` the job also ran
  # after FAILED builds and then either packed an incomplete bundle or
  # died inside download-artifact. The default (success of `needs`) is
  # correct: any real failure of a required job blocks the release.
  # --------------------------------------------------------------------------
  release-bundle:
    name: Bundle all binaries
    needs: [build, build-linux-x86]
    # Runs for version-like tags (v*), hierarchical release tags
    # (release/1.2.20), or when a GitHub Release is published. Note that
    # for the release event github.ref still points at the tag ref.
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/release/') ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # GITHUB_REF_NAME for the tag "release/1.2.20" contains a slash,
      # which would create an invalid zip file path — sanitize it.
      - name: Sanitize release name
        id: relname
        run: |
          set -euo pipefail
          SAFE="${GITHUB_REF_NAME//\//-}"
          echo "ref_name=${GITHUB_REF_NAME} -> safe=${SAFE}"
          echo "safe=${SAFE}" >> "$GITHUB_OUTPUT"

      - name: List and pack binaries
        run: |
          set -euo pipefail
          ls -laR dist
          mkdir -p bundle
          cp -v dist/mozvpn_beta-* bundle/ 2>/dev/null || true
          ls -la bundle
          if ! ls bundle/mozvpn_beta-* >/dev/null 2>&1; then
            echo "ERROR: no binaries found in dist/ — nothing to bundle" >&2
            exit 1
          fi
          cd bundle
          zip -9 "../mozvpn_beta-${{ steps.relname.outputs.safe }}.zip" ./*

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: mozvpn_beta-${{ steps.relname.outputs.safe }}-all
          path: mozvpn_beta-${{ steps.relname.outputs.safe }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: mozvpn_beta-${{ steps.relname.outputs.safe }}.zip
          generate_release_notes: true
