# ============================================================================
# Free Mozilla VPN — build mozvpn_beta.py with Nuitka (Python 3.14)
# Targets: Windows (x86, x64, ARM64) and Linux (x86, x64, ARM64)
#
# Verified facts (2026-09-24):
#   * Python 3.14 is a stable release (released 2025-10-07).
#   * Nuitka supports Python 3.4–3.14 (current release line supports 3.14
#     officially; experimental support for 3.15 has started).
#   * Nuitka does NOT cross-compile: every target is built natively
#     on a runner with the corresponding OS and architecture.
#   * Ready-made GitHub runners: ubuntu-latest (x86_64), ubuntu-24.04-arm
#     (arm64, free for public repositories), windows-latest (x86_64),
#     windows-11-arm (arm64, free for public repositories since April 2025).
#     There are NO 32-bit hosted runners, so:
#       - Windows x86 is built on windows-latest x64 using a 32-bit
#         Python (architecture: x86) + MinGW i686 (Nuitka downloads it
#         automatically).
#       - Linux x86 is built on ubuntu-latest from a self-compiled
#         32-bit CPython 3.14 (gcc -m32); the job is marked
#         continue-on-error since it is the most fragile target.
#   * ARM runners on GitHub are free for public repositories; for a
#     private repository you need a paid larger runner or a self-hosted
#     runner.
# ============================================================================

name: Build Free Mozilla VPN

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  APP_NAME: "Free Mozilla VPN"
  SCRIPT: mozvpn_beta.py
  PYTHON_VERSION: "3.14"
  # Version used for Windows binary resources
  FILE_VERSION: "1.0.0.0"

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Main matrix: targets for which ready-made runners exist, or a 32-bit
  # Python available via setup-python (Windows x86).
  # --------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- Linux x86_64 -----
          - os: ubuntu-latest
            target: linux-x86_64
            python_arch: x64
            experimental: false
          # ----- Linux arm64 (free for public repositories) -----
          - os: ubuntu-24.04-arm
            target: linux-arm64
            python_arch: arm64
            experimental: false
          # ----- Windows x64 -----
          - os: windows-latest
            target: windows-x64
            python_arch: x64
            experimental: false
          # ----- Windows ARM64 (free for public repositories) -----
          - os: windows-11-arm
            target: windows-arm64
            python_arch: arm64
            experimental: false
          # ----- Windows x86 (32-bit Python + MinGW i686) -----
          - os: windows-latest
            target: windows-x86
            python_arch: x86
            experimental: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }} (${{ matrix.python_arch }})
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi
          python -m pip install --upgrade nuitka ordered-set zstandard

      - name: Install C compiler cache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang

      - name: Show toolchain info
        shell: bash
        run: |
          python --version
          python -c "import platform, sysconfig; print(platform.machine(), sysconfig.get_platform())"
          python -m nuitka --version

      # ------------------------------------------------------------------------
      # Nuitka build with optimizations:
      #   --standalone        : self-contained environment (no installed Python
      #                         required on the target machine)
      #   --onefile           : a single self-sufficient executable file
      #   --lto=yes           : whole-program link-time optimization
      #   --clang (Linux)     : clang is faster and more memory-efficient
      #                         than gcc
      #   --remove-output     : delete the temporary build folder
      #   --assume-yes-for-downloads : let Nuitka download MinGW (Windows),
      #                         ccache and depends.exe automatically when
      #                         needed
      # ------------------------------------------------------------------------
      - name: Compile with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --clang \
            --jobs=4 \
            --output-dir=build \
            --output-filename="mozvpn_beta-${{ matrix.target }}" \
            --company-name="${{ env.APP_NAME }}" \
            --product-name="${{ env.APP_NAME }}" \
            --file-description="${{ env.APP_NAME }} (mozvpn_beta)" \
            --file-version="${{ env.FILE_VERSION }}" \
            --product-version="${{ env.FILE_VERSION }}" \
            --remove-output \
            --assume-yes-for-downloads \
            "${{ env.SCRIPT }}"

      - name: Compile with Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m nuitka `
            --standalone `
            --onefile `
            --lto=yes `
            --jobs=4 `
            --output-dir=build `
            --output-filename="mozvpn_beta-${{ matrix.target }}.exe" `
            --company-name="${{ env.APP_NAME }}" `
            --product-name="${{ env.APP_NAME }}" `
            --file-description="${{ env.APP_NAME }} (mozvpn_beta)" `
            --file-version="${{ env.FILE_VERSION }}" `
            --product-version="${{ env.FILE_VERSION }}" `
            --copyright="Free Mozilla VPN" `
            --windows-console-mode=force `
            --remove-output `
            --assume-yes-for-downloads `
            "${{ env.SCRIPT }}"

      - name: Smoke test binary (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          file "build/mozvpn_beta-${{ matrix.target }}"
          # --help/-h works if the script uses argparse; otherwise replace
          # it with a safe flag or remove this step.
          "./build/mozvpn_beta-${{ matrix.target }}" --help || true

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "build/mozvpn_beta-${{ matrix.target }}.exe"
          if (Test-Path $bin) { & $bin --help; if ($LASTEXITCODE -ne 0) { Write-Host "exit=$LASTEXITCODE" } }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mozvpn_beta-${{ matrix.target }}
          path: build/mozvpn_beta-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Linux x86 (32-bit): there is no ready-made hosted runner and no 32-bit
  # CPython in setup-python, so we build CPython 3.14 from source with -m32.
  # This is the most fragile target — marked as experimental.
  # --------------------------------------------------------------------------
  build-linux-x86:
    name: Build linux-x86 (32-bit, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies and 32-bit toolchain
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib g++-multilib \
            pkg-config wget ccache \
            libncurses-dev:i386 zlib1g-dev:i386 libbz2-dev:i386 \
            libreadline-dev:i386 libsqlite3-dev:i386 libffi-dev:i386 \
            libssl-dev:i386 liblzma-dev:i386 uuid-dev:i386

      - name: Build 32-bit CPython ${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail
          PYVER="${PYTHON_VERSION}"
          PYMINOR="${PYVER#*.}"
          SRCDIR="Python-${PYVER}"
          wget -q "https://www.python.org/ftp/python/${PYVER}/Python-${PYVER}.tar.xz"
          tar -xf "Python-${PYVER}.tar.xz"
          cd "${SRCDIR}"
          # 32-bit build via -m32 on an x86_64 host (the x86_64 kernel
          # runs 32-bit code natively, no emulation is required).
          CC="gcc -m32" CXX="g++ -m32" \
            ./configure \
              --build=i686-pc-linux-gnu \
              --prefix="$HOME/.local/python32" \
              --enable-optimizations \
              --with-lto \
              --disable-test-modules
          make -j"$(nproc)"
          make install
          cd ..
          rm -rf "${SRCDIR}" "Python-${PYVER}.tar.xz"

      - name: Install Nuitka into 32-bit Python
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/python32/bin:$PATH"
          python3 --version
          python3 -c "import platform; print('arch:', platform.machine())"
          if [ -f requirements.txt ]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements.txt
          fi
          python3 -m pip install --upgrade nuitka ordered-set zstandard

      - name: Compile with Nuitka (32-bit Linux)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/python32/bin:$PATH"
          python3 -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --jobs=4 \
            --output-dir=build \
            --output-filename="mozvpn_beta-linux-x86" \
            --company-name="${{ env.APP_NAME }}" \
            --product-name="${{ env.APP_NAME }}" \
            --file-description="${{ env.APP_NAME }} (mozvpn_beta)" \
            --file-version="${{ env.FILE_VERSION }}" \
            --product-version="${{ env.FILE_VERSION }}" \
            --remove-output \
            --assume-yes-for-downloads \
            "${{ env.SCRIPT }}"

      - name: Smoke test 32-bit binary
        run: |
          set -euo pipefail
          file build/mozvpn_beta-linux-x86
          ./build/mozvpn_beta-linux-x86 --help || ./build/mozvpn_beta-linux-x86 -h || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mozvpn_beta-linux-x86
          path: build/mozvpn_beta-linux-x86*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Release: collects all binaries into a single zip (for v* tags).
  # --------------------------------------------------------------------------
  release-bundle:
    name: Bundle all binaries
    needs: [build, build-linux-x86]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List and pack binaries
        run: |
          set -euo pipefail
          ls -laR dist
          mkdir -p bundle
          cp -v dist/mozvpn_beta-* bundle/ 2>/dev/null || true
          ls -la bundle
          cd bundle
          zip -9 "../mozvpn_beta-${GITHUB_REF_NAME}.zip" ./*

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: mozvpn_beta-${{ github.ref_name }}-all
          path: mozvpn_beta-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: mozvpn_beta-${{ github.ref_name }}.zip
          generate_release_notes: true
